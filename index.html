function parseLengthMonths(s){
  if(!s)return null;
  if(typeof s==='number'&&!isNaN(s))return Math.round(s);
  s=String(s).toLowerCase();
  var m=/(\d+)\s*years?\s*\((\d+)\s*months?\)/.exec(s);
  if(m)return parseInt(m[1])*12+parseInt(m[2]);
  m=/(\d+)\s*years?\s*(?:and\s*)?(\d+)?\s*months?/.exec(s);
  if(m)return parseInt(m[1])*12+(parseInt(m[2]||'0')||0);
  m=/(\d+)\s*months?/.exec(s);
  if(m)return parseInt(m[1]);
  return null;
}

function monthsSinceDate(s){
  var iso=toIsoDate(s);
  if(!iso||!/^\d{4}-\d{2}-\d{2}$/.test(iso))return null;
  var start=new Date(iso+'T00:00:00');
  var today=new Date(todayISO()+'T00:00:00');
  if(isNaN(start.getTime()))return null;
  var months=(today.getFullYear()-start.getFullYear())*12+(today.getMonth()-start.getMonth());
  if(today.getDate()<start.getDate())months--;
  return Math.max(0,months);
}

function parseLOMRows(rows){
  var results=[];
  var hi=findHeaderRow(rows,['chapter','name','length']);
  if(hi<0)hi=findHeaderRow(rows,['chapter','name','start']);
  if(hi>=0){
    var h=rows[hi];
    var iChapter=colIndex(h,['Chapter Name','Chapter']);
    var iFirst=colIndex(h,['First Name','First']);
    var iLast=colIndex(h,['Last Name','Last']);
    var iName=colIndex(h,['Full Name','Member Name','Member','Name']);
    var iStatus=colIndex(h,['Membership Status','Status']);
    var iCumLen=colIndex(h,['Cumulative Length','Total Length','Length of Membership']);
    var iCumStart=colIndex(h,['Cumulative Start','Original Start','Start Date']);
    var iRecentLen=colIndex(h,['Recent Length','Current Length','Membership Length','Length']);
    var iRecentStart=colIndex(h,['Recent Start','Join Date','Induction Date','Renewal Start','Start Date']);
    rows.slice(hi+1).forEach(function(row){
      var chapter=matchChapterName(cellAt(row,iChapter));
      var firstName=cellAt(row,iFirst);
      var lastName=cellAt(row,iLast);
      var firstLast=(firstName+' '+lastName).trim();
      var name=cleanMemberNameForChapter(firstLast||cellAt(row,iName),chapter);
      var status=cellAt(row,iStatus)||'Active';
      var recentLength=cellAt(row,iRecentLen);
      var recentStart=toIsoDate(cellAt(row,iRecentStart)||cellAt(row,iCumStart));
      var recentMonths=parseLengthMonths(recentLength);
      if(recentMonths===null)recentMonths=monthsSinceDate(recentStart);
      if(chapter&&name&&(iStatus<0||/active/i.test(status))){
        results.push({
          chapter:chapter,
          firstName:firstName,
          lastName:lastName,
          name:name,
          status:status,
          cumulativeLength:cellAt(row,iCumLen),
          cumulativeStart:toIsoDate(cellAt(row,iCumStart)),
          recentLength:recentLength,
          recentStart:recentStart,
          recentMonths:recentMonths
        });
      }
    });
    return results;
  }
  rows.forEach(function(cells){
    if(cells.length>=7&&cells[0]&&normalizeHeader(cells[0])!=='chapter name'){
      var recentStart=toIsoDate(cells[6]);
      var recentMonths=parseLengthMonths(cells[5]);
      if(recentMonths===null)recentMonths=monthsSinceDate(recentStart);
      results.push({
        chapter:matchChapterName(cells[0]),
        firstName:cells[1],
        lastName:cells[2],
        name:(cells[1]+' '+cells[2]).trim(),
        cumulativeLength:cells[3],
        cumulativeStart:toIsoDate(cells[4]),
        recentLength:cells[5],
        recentStart:recentStart,
        recentMonths:recentMonths
      });
    }
  });
  return results;
}

function parseLOMLegacy(text){
  const rows=text.match(/<(?:ss:)?Row[^>]*>[\s\S]*?<\/(?:ss:)?Row>/g)||[];
  const results=[];let hdr=false;
  rows.forEach(function(row){
    const cells=[...row.matchAll(/<(?:ss:)?Data[^>]*>([^<]*)<\/(?:ss:)?Data>/g)].map(function(m){return decodeXmlText(m[1]);});
    if(!cells.length)return;
    if(cells[0]==='Chapter Name'){hdr=true;return;}
    if(hdr&&cells.length>=7&&cells[0]){
      results.push({
        chapter:matchChapterName(cells[0]),
        firstName:cells[1],
        lastName:cells[2],
        name:(cells[1]+' '+cells[2]).trim(),
        cumulativeLength:cells[3],
        cumulativeStart:toIsoDate(cells[4]),
        recentLength:cells[5],
        recentStart:toIsoDate(cells[6]),
        recentMonths:parseLengthMonths(cells[5])!==null?parseLengthMonths(cells[5]):monthsSinceDate(cells[6])
      });
    }
  });
  return results;
}

async function repairMiyagiStalledDates(){
  // One-time correction: members created before the lastActivityDate fix had it set to
  // their chapter join date instead of the date Miyagi tracking began. Reset to today
  // for anyone who genuinely has zero recorded activity yet.
  var today=todayISO();
  var toFix=S.miyagiMembers.filter(function(m){
    if((m.status||'active')!=='active')return false;
    var hasCheckpoints=m.checkpoints&&Object.keys(m.checkpoints).some(function(k){return m.checkpoints[k]&&m.checkpoints[k].done;});
    var hasCheckins=m.checkins&&Object.keys(m.checkins).length>0;
    if(hasCheckpoints||hasCheckins)return false; // has real activity, leave it alone
    return m.lastActivityDate===m.joinDate; // still showing the old buggy value
  });
  if(!toFix.length){toast('Nothing to repair - all clear');return;}
  if(!confirm('Reset "last activity" to today for '+toFix.length+' members with no recorded activity yet? This clears the incorrect stalled flag caused by a sync bug.'))return;
  for(var i=0;i<toFix.length;i++){
    try{await db.collection('miyagiMembers').doc(toFix[i].id).update({lastActivityDate:today});}
    catch(e){console.warn('Repair error:',e);}
  }
  toast('Repaired '+toFix.length+' member records');
}

async function syncMiyagiMembers(lomRows){
  var teamChapters=visibleChapterNames();
  var relevantRows=(lomRows||S.lomData).filter(function(r){return teamChapters.includes(r.chapter);});
  var currentByKey={};
  relevantRows.forEach(function(r){currentByKey[miyagiId(r.chapter,r.name)]=r;});

  var ops=[];

  // Auto-add newly eligible members (<12 months, not already tracked)
  relevantRows.forEach(function(r){
    if(r.recentMonths===null||r.recentMonths>=12)return;
    var mid=miyagiId(r.chapter,r.name);
    var existing=S.miyagiMembers.find(function(m){return m.id===mid;});
    if(!existing){
      ops.push({id:mid,data:{
        name:r.name,chapter:r.chapter,joinDate:r.recentStart,
        status:'active',score:0,checkpoints:{},checkins:{},
        lastActivityDate:todayISO(),createdAt:todayISO()
      }});
    }
  });

  // Auto-graduate members who crossed 12 months
  S.miyagiMembers.forEach(function(m){
    if(m.status!=='active')return;
    var row=currentByKey[m.id];
    if(row&&row.recentMonths!==null&&row.recentMonths>=12){
      ops.push({id:m.id,data:{status:'graduated',statusChangedDate:todayISO(),finalScore:m.score||0,finalBelt:getMiyagiBelt(m.score||0).name}});
    }
  });

  // Auto-drop members missing from both Length-of-Membership AND Dues report
  S.miyagiMembers.forEach(function(m){
    if(m.status!=='active')return;
    var inLOM=!!currentByKey[m.id];
    var inDues=(S.duesData||[]).some(function(d){return d.chapter===m.chapter&&d.name.toLowerCase()===m.name.toLowerCase();});
    if(!inLOM&&!inDues){
      ops.push({id:m.id,data:{status:'dropped',statusChangedDate:todayISO(),finalScore:m.score||0,finalBelt:getMiyagiBelt(m.score||0).name}});
    }
  });

  for(var i=0;i<ops.length;i++){
    try{await db.collection('miyagiMembers').doc(ops[i].id).set(ops[i].data,{merge:true});}
    catch(e){console.warn('Miyagi sync error:',e);}
  }
  toast('Miyagi sync complete: '+ops.length+' updates');
}

// CHECKPOINT MARKING ──────────────────────────────────────
async function toggleMiyagiCheckpoint(memberId,taskKey){
  var member=S.miyagiMembers.find(function(m){return m.id===memberId;});
  if(!member)return;
  var cp=Object.assign({},member.checkpoints||{});
  var isDone=cp[taskKey]&&cp[taskKey].done;
  cp[taskKey]=isDone?{done:false}:{done:true,date:todayISO(),markedBy:S.user.name};
  var newScore=calcMiyagiScore(cp);
  var updates={checkpoints:cp,score:newScore};
  if(!isDone)updates.lastActivityDate=todayISO();
  try{
    await db.collection('miyagiMembers').doc(memberId).update(updates);
    logActivity('miyagi_checkpoint_toggled',{memberName:member.name,task:taskKey,done:!isDone});
    toast(isDone?'Checkpoint unmarked':'Yes Checkpoint marked');
  }catch(e){toast('Failed: '+e.message);}
}

// CHECK-IN DUE DETECTION (3/6/9/12mo, ±2wk grace) ─────────
function getMiyagiCheckinsDue(member){
  var due=[];
  if(!member.joinDate)return due;
  var join=new Date(member.joinDate+'T00:00:00');
  var today=new Date(todayISO()+'T00:00:00');
  [3,6,9,12].forEach(function(months){
    var dueDate=new Date(join);dueDate.setMonth(dueDate.getMonth()+months);
    var key=months+'month';
    var already=member.checkins&&member.checkins[key]&&member.checkins[key].submittedDate;
    if(already)return;
    var graceStart=new Date(dueDate);graceStart.setDate(graceStart.getDate()-14);
    if(today>=graceStart){
      due.push({months:months,key:key,dueDate:toLocalISODate(dueDate),overdue:today>dueDate});
    }
  });
  return due;
}

function activityDetailSummary(a){
  var d=a.details||{};
  var parts=[];
  if(d.chapter)parts.push(d.chapter);
  if(d.date)parts.push(fmtD(d.date));
  if(d.memberName)parts.push(d.memberName);
  if(d.chapterName)parts.push(d.chapterName);
  if(d.contactId)parts.push(d.contactId);
  if(d.task)parts.push(d.task);
  if(d.checkin)parts.push(d.checkin);
  if(d.month)parts.push(d.month);
  if(d.target!==undefined)parts.push('target: '+d.target);

// STALLED MEMBER DETECTION (no activity 2+ weeks) ─────────
function hasMiyagiActivity(member){
  var hasCheckpoints=member.checkpoints&&Object.keys(member.checkpoints).some(function(k){return member.checkpoints[k]&&member.checkpoints[k].done;});
  var hasCheckins=member.checkins&&Object.keys(member.checkins).length>0;
  return!!(hasCheckpoints||hasCheckins);
}

// Never Started: zero checkpoints AND zero check-ins logged, ever - a distinct category from "went quiet"
function isMiyagiNeverStarted(member){
  return!hasMiyagiActivity(member);
}

// Stalled 2+ weeks: HAD at least one activity, but nothing in the last 14+ days
// Members who never started at all are NOT counted as stalled - they're their own category
function isMiyagiStalled(member){
  if(!hasMiyagiActivity(member))return false;
  if(!member.lastActivityDate)return false;
  var last=new Date(member.lastActivityDate+'T00:00:00');
  var today=new Date(todayISO()+'T00:00:00');
  var daysSince=Math.round((today-last)/86400000);
  return daysSince>=14;
}

  h+='<div style="display:flex;flex-direction:column;gap:8px;">';
  filtered.forEach(function(m){
    var belt=getMiyagiBelt(m.score||0);
    var checkpointsDone=MIYAGI_TASKS.filter(function(t){return m.checkpoints&&m.checkpoints[t.key]&&m.checkpoints[t.key].done;}).length;
    var checkinsDue=getMiyagiCheckinsDue(m);
    var stalled=(m.status||'active')==='active'&&isMiyagiStalled(m);
    var neverStarted=(m.status||'active')==='active'&&isMiyagiNeverStarted(m);
    var isExpanded=MIYAGI_EXPANDED===m.id;

    h+='<div style="border:1px solid '+(stalled?'rgba(239,68,68,.3)':neverStarted?'rgba(251,191,36,.3)':'var(--border)')+';border-radius:10px;padding:12px 14px;'+(stalled?'background:rgba(239,68,68,.03);':neverStarted?'background:rgba(251,191,36,.03);':'')+'">';
    h+='<div style="display:flex;justify-content:space-between;align-items:center;cursor:pointer;" onclick="toggleMiyagiExpand(\''+m.id+'\')">';
    h+='<div>';
    h+='<span style="font-weight:700;">'+esc(m.name)+'</span> ';
    h+='<span class="tm">'+esc(m.chapter)+'</span>';
    if(stalled)h+=' <span style="color:var(--red);font-size:11px;font-weight:700;">Warning: Stalled 2+ wks</span>';
    if(neverStarted)h+=' <span style="color:var(--amber);font-size:11px;font-weight:700;">Not Started Never Started</span>';
    if(m.status==='graduated')h+=' <span style="color:var(--green);font-size:11px;font-weight:700;">Yes Graduated</span>';
    if(m.status==='dropped')h+=' <span style="color:var(--red);font-size:11px;font-weight:700;">No Dropped</span>';
    h+='</div>';
    h+='<div style="display:flex;align-items:center;gap:10px;">';
    if(checkinsDue.length)h+='<span style="font-size:10px;font-weight:700;color:'+(checkinsDue.some(function(c){return c.overdue;})?'var(--red)':'var(--amber)')+';background:'+(checkinsDue.some(function(c){return c.overdue;})?'rgba(239,68,68,.1)':'rgba(251,191,36,.1)')+';padding:3px 8px;border-radius:6px;">'+checkinsDue.length+' check-in due</span>';
    h+='<span style="font-size:12px;color:var(--muted);">'+checkpointsDone+'/'+MIYAGI_TASKS.length+'</span>';
    h+='<span style="background:'+belt.color+'20;color:'+belt.color+';padding:3px 10px;border-radius:8px;font-size:12px;font-weight:700;">'+esc(belt.name)+' - '+(m.score||0)+'pt</span>';
    h+='<span style="font-size:12px;color:var(--muted);">'+(isExpanded?'▲':'▼')+'</span>';
    h+='</div></div>';

    if(isExpanded){
      h+='<div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border);">';

      if(checkinsDue.length){
        h+='<div style="margin-bottom:12px;">';
        h+='<div style="font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.5px;margin-bottom:6px;">DIRECTOR CHECK-INS DUE</div>';
        checkinsDue.forEach(function(c){
          h+='<button class="btn btn-sm" style="background:'+(c.overdue?'rgba(239,68,68,.12)':'rgba(251,191,36,.12)')+';color:'+(c.overdue?'var(--red)':'var(--amber)')+';margin-right:6px;margin-bottom:4px;" onclick="event.stopPropagation();openMiyagiCheckin(\''+m.id+'\',\''+c.key+'\')">'+c.months+'-Month Check-in'+(c.overdue?' (Overdue)':'')+'</button>';
        });
        h+='</div>';
      }

      h+='<div style="font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.5px;margin-bottom:6px;">CHECKPOINTS ('+checkpointsDone+'/'+MIYAGI_TASKS.length+')</div>';
      h+='<div style="display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;align-items:stretch;gap:6px;">';
      MIYAGI_TASKS.forEach(function(t){
        var done=m.checkpoints&&m.checkpoints[t.key]&&m.checkpoints[t.key].done;
        h+='<label style="display:flex;align-items:flex-start;gap:7px;font-size:12px;padding:5px 7px;border-radius:6px;min-width:0;width:100%;'+(done?'background:rgba(45,155,111,.08);':'')+'cursor:pointer;">';
        h+='<input type="checkbox" style="flex-shrink:0;width:16px;height:16px;padding:0;margin-top:2px;" '+(done?'checked':'')+' '+(canEdit?'':'disabled')+' onclick="event.stopPropagation();toggleMiyagiCheckpoint(\''+m.id+'\',\''+t.key+'\')">';
        h+='<span style="flex:1;min-width:0;word-break:break-word;'+(done?'color:var(--green);font-weight:600;':'')+'">'+t.label+' <span class="tm">('+t.points+'pt)</span></span>';
        h+='</label>';
      });
      h+='</div>';

      // Show completed check-ins summary
      var doneCheckins=Object.keys(m.checkins||{});
      if(doneCheckins.length){
        h+='<div style="margin-top:10px;font-size:11px;color:var(--muted);">Completed check-ins: '+doneCheckins.map(function(k){return k.replace('month',' Month');}).join(', ')+'</div>';
      }

      h+='</div>';
    }
    h+='</div>';
  });
  h+='</div></div>';
  el.innerHTML=h;
}

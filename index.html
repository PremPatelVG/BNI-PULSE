<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BNI CHAPTER PULSE">
<title>BNI CHAPTER PULSE</title>
<script src="/vendor/exceljs.min.js"></script>
<style>
:root{--navy:#1A1F2E;--red:#E63946;--green:#2D9B6F;--amber:#F4A261;--purple:#7C3AED;--blue:#3B82F6;--surface:#F0F2F7;--card:#fff;--text:#1A1F2E;--muted:#6B7280;--border:#E5E7EB;--r:14px;--sh:0 2px 10px rgba(0,0,0,0.07);}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:Calibri, Arial, sans-serif;background:var(--surface);color:var(--text);min-height:100vh;}
.loader{position:fixed;inset:0;background:var(--navy);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;color:#fff;gap:12px;}
.loader-t1{font-size:32px;font-weight:900;letter-spacing:-.5px;}.loader-t1 em{color:var(--red);font-style:normal;}
.brand-bni{color:var(--red);font-weight:900;}
.loader-t2{font-size:11px;opacity:.4;letter-spacing:2px;text-transform:uppercase;}
.spin{width:28px;height:28px;border:3px solid rgba(255,255,255,.12);border-top-color:var(--red);border-radius:50%;animation:sp .7s linear infinite;}
@keyframes sp{to{transform:rotate(360deg);}}
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--navy);padding:16px;}
.login-box{background:var(--card);border-radius:20px;padding:32px 28px;width:100%;max-width:380px;}
.brand{text-align:center;margin-bottom:24px;}
.brand .b1{font-size:30px;font-weight:900;letter-spacing:-.5px;}.brand .b1 em{color:var(--red);font-style:normal;}
.brand .b2{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:1.5px;text-transform:uppercase;margin-top:3px;}
.brand .b3{display:inline-block;background:#fee2e2;color:var(--red);font-size:10px;font-weight:800;padding:3px 12px;border-radius:10px;letter-spacing:.5px;margin-top:7px;}
.fg{display:flex;flex-direction:column;gap:4px;margin-bottom:12px;}
label{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.5px;text-transform:uppercase;}
input,select,textarea{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:9px;font-size:14px;font-family:inherit;color:var(--text);background:var(--card);transition:border-color .15s;}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--navy);}
textarea{resize:vertical;min-height:68px;}
.pin-f{font-size:24px;letter-spacing:8px;text-align:center;}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:11px;}
.full{grid-column:1/-1;}
.btn{padding:10px 16px;border-radius:9px;font-size:14px;font-weight:700;cursor:pointer;border:none;transition:all .15s;display:inline-flex;align-items:center;justify-content:center;gap:6px;}
.btn-primary{background:var(--red);color:#fff;}.btn-primary:hover{background:#c62a35;}
.btn-navy{background:var(--navy);color:#fff;}.btn-navy:hover{background:#262d42;}
.btn-secondary{background:var(--surface);color:var(--text);}
.btn-green{background:var(--green);color:#fff;}
.btn-sm{padding:5px 11px;font-size:12px;}.btn-block{width:100%;}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;}
.hdr{background:var(--navy);color:#fff;padding:10px 18px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
.hdr-brand .h1{font-size:18px;font-weight:900;letter-spacing:-.3px;}.hdr-brand .h1 em{color:var(--red);font-style:normal;}
.hdr-brand .h2{font-size:9px;opacity:.4;letter-spacing:1.2px;text-transform:uppercase;}
.hdr-r{display:flex;align-items:center;gap:8px;}
.sync-pill{display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.1);border-radius:20px;padding:4px 10px;font-size:11px;font-weight:600;}
.sdot{width:7px;height:7px;border-radius:50%;background:var(--green);}.sdot.off{background:var(--amber);}
.uchip{background:rgba(255,255,255,.12);border-radius:20px;padding:5px 12px;font-size:11px;font-weight:600;cursor:pointer;}
.uchip:hover{background:rgba(255,255,255,.2);}
.nav{background:var(--navy);border-top:1px solid rgba(255,255,255,.07);display:flex;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;position:relative;}
.nav::after{content:'';position:absolute;right:0;top:0;bottom:0;width:30px;background:linear-gradient(to right,transparent,var(--navy));pointer-events:none;}
.nav::-webkit-scrollbar{display:none;}
.nt{color:rgba(255,255,255,.4);padding:10px 15px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;transition:all .15s;}
.nt.active{color:#fff;border-bottom-color:var(--red);}.nt:hover:not(.active){color:rgba(255,255,255,.75);}
.main{padding:16px;max-width:1100px;margin:0 auto;}
.card{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:var(--sh);margin-bottom:12px;}
.card-t{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.8px;text-transform:uppercase;margin-bottom:12px;}
.sec-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px;}
.sec-title{font-size:17px;font-weight:800;}
.ov-stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;}
.ov-stat{flex:1;min-width:80px;background:var(--card);border-radius:12px;padding:12px 10px;text-align:center;box-shadow:var(--sh);}
.ov-sv{font-size:22px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.1;}
.ov-sl{font-size:10px;color:var(--muted);font-weight:600;margin-top:3px;}
.ch-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
.ch-card{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:var(--sh);cursor:pointer;transition:transform .15s,box-shadow .15s;border-top:4px solid var(--border);}
.ch-card:hover{transform:translateY(-3px);box-shadow:0 6px 20px rgba(0,0,0,.11);}
.ch-card.cg{border-top-color:var(--green);}.ch-card.ca{border-top-color:var(--amber);}
.ch-card.cr{border-top-color:var(--red);}.ch-card.cgr{border-top-color:#9CA3AF;}
.ch-card-hdr{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px;}
.ch-name{font-size:17px;font-weight:800;letter-spacing:-.2px;}
.ch-day{font-size:11px;color:var(--muted);margin-top:1px;}
.ch-sub{font-size:11px;color:var(--muted);margin-bottom:12px;min-height:16px;}
.tlr-pill{padding:3px 9px;border-radius:20px;font-size:12px;font-weight:800;}
.tlr-pill.pg{background:#dcfce7;color:#166534;}.tlr-pill.pa{background:#fef3c7;color:#92400e;}
.tlr-pill.pr{background:#fee2e2;color:#991b1b;}.tlr-pill.pgr{background:#F3F4F6;color:#6B7280;}
.ch-stats-top{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:8px;}
.ch-stats-bot{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px;}
.csv{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;text-align:center;line-height:1.1;}
.csl{font-size:10px;color:var(--muted);text-align:center;margin-top:2px;}
.tlr-track{background:var(--surface);border-radius:4px;height:6px;overflow:hidden;}
.tlr-fill{height:100%;border-radius:4px;transition:width .5s;}
.tlr-bar-lbl{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-bottom:3px;}
.badge-out{background:#F3F4F6;color:#6B7280;font-size:10px;padding:3px 8px;border-radius:6px;font-weight:700;}
.badge-mine{background:#ede9fe;color:#5b21b6;font-size:9px;padding:2px 6px;border-radius:5px;font-weight:700;margin-left:4px;}
.wrow{display:flex;gap:6px;flex-wrap:wrap;}
.wchip{padding:5px 12px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;border:1.5px solid var(--border);background:var(--card);color:var(--muted);transition:all .15s;}
.wchip.active{background:var(--navy);color:#fff;border-color:var(--navy);}
.ms-wrap{position:relative;}
.ms-btn{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:9px;font-size:14px;font-family:inherit;color:var(--text);background:var(--card);cursor:pointer;text-align:left;display:flex;justify-content:space-between;align-items:center;}
.ms-btn:focus{outline:none;border-color:var(--navy);}
.ms-dd{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--card);border:1.5px solid var(--border);border-radius:9px;box-shadow:0 4px 16px rgba(0,0,0,.12);z-index:50;overflow:hidden;max-height:220px;overflow-y:auto;}
.ms-opt{display:flex;align-items:center;gap:9px;padding:10px 13px;cursor:pointer;font-size:13px;transition:background .1s;}
.ms-opt:hover{background:var(--surface);}
.ms-opt input{width:15px;height:15px;cursor:pointer;accent-color:var(--navy);flex-shrink:0;}
.entry-row{display:flex;justify-content:space-between;align-items:center;padding:10px 11px;border-radius:9px;font-size:13px;background:var(--surface);margin-bottom:4px;}
.call-wrap{background:var(--navy);border-radius:var(--r);color:#fff;padding:18px;}
.call-sel{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
.call-btn{padding:6px 12px;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;border:1.5px solid rgba(255,255,255,.2);background:transparent;color:#fff;transition:all .15s;}
.call-btn.active{background:var(--red);border-color:var(--red);}.call-btn.att-green{border-color:var(--green);color:#4ade80;}.call-btn.att-green.active{background:var(--green);border-color:var(--green);color:#fff;}.call-btn.att-amber{border-color:var(--amber);color:var(--amber);}.call-btn.att-amber.active{background:var(--amber);border-color:var(--amber);color:#fff;}.call-btn.att-red{border-color:#f87171;color:#f87171;}.call-btn.att-red.active{background:#f87171;border-color:#f87171;color:#fff;}
.call-name{font-size:26px;font-weight:900;}.call-sub{font-size:12px;opacity:.5;margin-top:2px;}
.call-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px;}
.call-box{background:rgba(255,255,255,.07);border-radius:10px;padding:13px;}
.call-val{font-size:25px;font-weight:900;font-variant-numeric:tabular-nums;}
.call-lbl{font-size:9px;opacity:.4;font-weight:700;letter-spacing:.7px;margin-top:2px;}
.call-delta{font-size:11px;margin-top:3px;opacity:.8;}
.pos{color:#4ade80;}.neg{color:#f87171;}
.story-box{margin-top:12px;background:rgba(255,255,255,.06);border-radius:10px;padding:13px;}
.attend-section{margin-top:12px;background:rgba(255,255,255,.05);border-radius:10px;padding:12px;}
.attend-title{font-size:9px;font-weight:700;opacity:.4;letter-spacing:.8px;text-transform:uppercase;margin-bottom:9px;}
.attend-row{display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.07);}
.attend-row:last-child{border-bottom:none;}
.attend-name{font-size:13px;font-weight:600;}
.attend-role{font-size:10px;opacity:.45;margin-left:6px;}
.attend-check{width:20px;height:20px;cursor:pointer;accent-color:var(--green);}
.tlr-improve{margin-top:12px;background:rgba(255,255,255,.05);border-radius:10px;padding:12px;}
.improve-title{font-size:9px;font-weight:700;opacity:.4;letter-spacing:.8px;text-transform:uppercase;margin-bottom:8px;}
.improve-item{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.07);font-size:12px;}
.improve-item:last-child{border-bottom:none;}
.improve-gap{color:#fbbf24;font-size:11px;font-weight:600;}
.ren-call{margin-top:12px;background:rgba(255,255,255,.05);border-radius:10px;padding:12px;}
.ren-call-title{font-size:9px;font-weight:700;opacity:.4;letter-spacing:.8px;text-transform:uppercase;margin-bottom:9px;}
.ren-call-item{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.07);font-size:12px;}
.ren-call-item:last-child{border-bottom:none;}
.trend-section{margin-top:14px;border-top:1px solid rgba(255,255,255,.08);padding-top:12px;}
.trend-toggle{font-size:9px;font-weight:700;opacity:.4;letter-spacing:.8px;text-transform:uppercase;margin-bottom:10px;cursor:pointer;display:flex;align-items:center;gap:6px;user-select:none;}
.spark-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.spark-box{background:rgba(255,255,255,.06);border-radius:8px;padding:10px;}
.spark-lbl{font-size:9px;opacity:.4;font-weight:600;letter-spacing:.5px;margin-bottom:6px;}
.spark-bars{display:flex;align-items:flex-end;gap:3px;height:36px;}
.spark-bar{flex:1;border-radius:2px 2px 0 0;min-height:2px;}
.spark-val{font-size:17px;font-weight:800;margin-top:5px;}
.spark-sub{font-size:9px;opacity:.35;margin-top:1px;}
.drill-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;opacity:0;pointer-events:none;transition:opacity .3s;}
.drill-overlay.open{opacity:1;pointer-events:all;}
.drill-sheet{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-radius:20px 20px 0 0;padding:20px;max-height:88vh;overflow-y:auto;transform:translateY(100%);transition:transform .35s cubic-bezier(.32,.72,0,1);z-index:201;max-width:760px;margin:0 auto;}
.drill-sheet.open{transform:translateY(0);}
.drill-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 16px;}
.drill-title{font-size:22px;font-weight:900;margin-bottom:3px;}
.drill-sub{font-size:12px;color:var(--muted);margin-bottom:16px;}
.sec-div{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.8px;text-transform:uppercase;margin:16px 0 8px;padding-bottom:5px;border-bottom:1px solid var(--border);}
.month-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:9px;margin-bottom:14px;}
.month-card{background:var(--surface);border-radius:9px;padding:11px;}
.month-lbl{font-size:10px;font-weight:700;color:var(--muted);margin-bottom:5px;}
.month-val{font-size:21px;font-weight:800;font-variant-numeric:tabular-nums;}
.month-sub{font-size:10px;color:var(--muted);margin-top:2px;}
.chart-wrap{background:var(--surface);border-radius:9px;padding:12px;margin-bottom:11px;}
.chart-title{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.5px;text-transform:uppercase;margin-bottom:10px;}
.bar-chart{display:flex;align-items:flex-end;gap:4px;height:80px;}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;}
.bar-fill{width:100%;border-radius:3px 3px 0 0;min-height:2px;}
.bar-lbl{font-size:9px;color:var(--muted);text-align:center;white-space:nowrap;}
.bar-val{font-size:9px;font-weight:700;color:var(--muted);}
.report-filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:flex-end;}
.report-filters .fg{margin-bottom:0;flex:1;min-width:140px;}
.rtbl{width:100%;border-collapse:collapse;font-size:13px;}
.rtbl th{text-align:left;padding:9px 10px;font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.5px;border-bottom:2px solid var(--border);white-space:nowrap;}
.rtbl td{padding:9px 10px;border-bottom:1px solid var(--border);}
.rtbl tr:last-child td{border-bottom:none;}
.rtbl tr:hover td{background:var(--surface);}
.pill{display:inline-block;padding:3px 8px;border-radius:9px;font-size:11px;font-weight:700;}
.pg{background:#dcfce7;color:#166534;}.pa{background:#fef3c7;color:#92400e;}.pr{background:#fee2e2;color:#991b1b;}.pgr{background:#F3F4F6;color:#6B7280;}
.tbl{width:100%;border-collapse:collapse;font-size:13px;}
.tbl th{text-align:left;padding:8px 9px;font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.5px;border-bottom:1px solid var(--border);}
.tbl td{padding:9px;border-bottom:1px solid var(--border);}
.tbl tr:last-child td{border-bottom:none;}
.ren-sec{margin-bottom:15px;}
.ren-title{font-weight:800;font-size:14px;padding-bottom:5px;border-bottom:2px solid var(--border);margin-bottom:7px;}
.ren-item{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);}
.ren-item:last-child{border-bottom:none;}
.ub{font-size:11px;font-weight:700;padding:3px 7px;border-radius:7px;}
.ur{background:#fee2e2;color:#991b1b;}.ua{background:#fef3c7;color:#92400e;}.ug{background:#dcfce7;color:#166534;}
.s-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);}
.s-row:last-child{border-bottom:none;}
.role-tag{display:inline-block;padding:2px 7px;border-radius:5px;font-size:10px;font-weight:700;}
.role-tag.ad{background:#111827;color:#fff;}.role-tag.dc{background:#dbeafe;color:#1e40af;}.role-tag.cd{background:#dbeafe;color:#1e40af;}.role-tag.sa{background:#dcfce7;color:#166534;}
.role-tag.viewer{background:#ede9fe;color:#5b21b6;}.role-tag.srdc{background:#fee2e2;color:#991b1b;}
.dropz{border:2px dashed var(--border);border-radius:var(--r);padding:26px;text-align:center;cursor:pointer;transition:all .2s;}
.dropz:hover{border-color:var(--navy);background:rgba(26,31,46,.03);}
.dropz input{display:none;}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(60px);background:var(--navy);color:#fff;padding:11px 20px;border-radius:10px;font-size:13px;font-weight:600;z-index:9999;opacity:0;transition:all .3s;pointer-events:none;white-space:pre-line;max-width:min(92vw,620px);text-align:left;line-height:1.35;}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1;}
.hidden{display:none!important;}.tm{color:var(--muted);font-size:12px;}
.empty{text-align:center;padding:28px 16px;color:var(--muted);}
.mt2{margin-top:8px;}.mt3{margin-top:12px;}
.err-msg{color:var(--red);font-size:12px;text-align:center;margin-top:5px;}
.risk-badge{font-size:11px;font-weight:700;padding:3px 8px;border-radius:7px;}
.risk-h{background:#fee2e2;color:#991b1b;}.risk-m{background:#fef3c7;color:#92400e;}.risk-l{background:#dcfce7;color:#166534;}
.ch-switcher{display:flex;gap:8px;margin-bottom:16px;}
.ch-sw-btn{padding:8px 16px;border-radius:9px;font-size:13px;font-weight:700;cursor:pointer;border:2px solid var(--border);background:var(--card);color:var(--muted);transition:all .15s;}
.ch-sw-btn.active{background:var(--navy);color:#fff;border-color:var(--navy);}
.dc-hero{background:linear-gradient(135deg,var(--navy) 0%,#2d3550 100%);border-radius:var(--r);padding:20px;color:#fff;margin-bottom:14px;}
.dc-hero-title{font-size:22px;font-weight:900;margin-bottom:4px;}
.dc-hero-sub{font-size:12px;opacity:.5;}
.dc-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px;}
.dc-stat{background:rgba(255,255,255,.08);border-radius:10px;padding:12px;text-align:center;}
.dc-sv{font-size:24px;font-weight:900;font-variant-numeric:tabular-nums;}
.dc-sl{font-size:10px;opacity:.45;font-weight:600;margin-top:2px;}
@media(max-width:700px){
  .ch-grid{grid-template-columns:1fr;}
  .ch-stats-top{grid-template-columns:repeat(2,1fr);}
  .fgrid{grid-template-columns:1fr;}
  .call-grid{grid-template-columns:1fr 1fr;}
  .spark-grid{grid-template-columns:repeat(2,1fr);}
  .ov-stats{gap:6px;}.ov-sv{font-size:18px;}
  .report-filters{flex-direction:column;}
  .month-grid{grid-template-columns:repeat(2,1fr);}
  .dc-stats{grid-template-columns:repeat(2,1fr);}
}

.logo-bar{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;}
.logo-bar img{max-height:48px;max-width:100px;object-fit:contain;}
.login-arg-logo{display:flex;justify-content:center;margin-bottom:12px;}
.login-arg-logo img{max-height:64px;max-width:160px;object-fit:contain;}
.hdr-logo{height:38px;width:auto;object-fit:contain;margin-right:10px;}
.radar-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.preview-card{background:var(--surface);border-radius:8px;padding:10px;}
/* Area Director filter bar. The old fixed minmax(220px,...) tracks summed wider
   than a phone viewport and pushed the whole page into horizontal scroll. */
.ad-filter-grid{display:grid;grid-template-columns:minmax(220px,1fr) minmax(220px,320px) auto;gap:10px;align-items:end;}
@media(max-width:720px){
  .ad-filter-grid{grid-template-columns:1fr;align-items:stretch;}
  .ad-filter-grid>button{width:100%;}
}
/* The Goals grid renders one editable row per chapter - 3,000+ inputs for an Area

// ── API TRANSPORT ──────────────────────────────────────────────────────────
// The browser talks only to this app's own backend. It never holds Firebase
// credentials and never reaches Firestore directly, so every read and write is
// authorised server-side against the caller's role and chapters.
const API_BASE='/api';
let AUTH_TOKEN=null;
try{AUTH_TOKEN=localStorage.getItem('bniPulseToken')||null;}catch(e){}

function setAuthToken(token){
  AUTH_TOKEN=token||null;
  try{if(token)localStorage.setItem('bniPulseToken',token);else localStorage.removeItem('bniPulseToken');}catch(e){}
}

function onSessionExpired(){
  setAuthToken(null);
  if(S.user){S.user=null;stopSync();hide('app');show('loginScreen');toast('Your session expired. Please sign in again.',5000);}
}

async function apiFetch(path,options){
  const opts=Object.assign({},options||{});
  opts.headers=Object.assign({},opts.headers||{});
  if(AUTH_TOKEN)opts.headers['Authorization']='Bearer '+AUTH_TOKEN;
  if(opts.body!==undefined&&typeof opts.body!=='string'){
    opts.headers['Content-Type']='application/json';
    opts.body=JSON.stringify(opts.body);
  }
  const res=await fetch(API_BASE+path,opts);
  if(res.status===401){onSessionExpired();throw new Error('Session expired - please sign in again');}
  if(res.status===204)return null;
  const text=await res.text();
  let data=null;
  if(text){try{data=JSON.parse(text);}catch(e){throw new Error('Unexpected response from server');}}
  if(!res.ok)throw new Error((data&&data.error)||('Request failed ('+res.status+')'));
  return data;
}

// ── FIRESTORE-SHAPED FACADE OVER THE API ───────────────────────────────────
// Presents the small slice of the Firestore compat surface this app already uses
// (collection/doc/get/set/update/delete/onSnapshot) so call sites stay unchanged,
// but every operation is an authenticated API call. Live updates are served from a
// single /api/snapshot poll that fans out to all registered listeners.
const SNAPSHOT_POLL_MS=120000;
let SNAP={collections:{},meta:{}};
let SNAP_LISTENERS=[];
let SNAP_TIMER=null;
let SNAP_INFLIGHT=null;

function snapCollection(name){return SNAP.collections[name]||[];}
function snapMeta(id){return SNAP.meta[id]||null;}

function makeQuerySnapshot(rows){
  const docs=rows.map(row=>{
    const {id,...rest}=row;
    return {id,exists:true,data:()=>rest};
  });
  return {docs,empty:docs.length===0,size:docs.length,forEach:fn=>docs.forEach(fn)};
}

function makeDocSnapshot(id,data){
  if(!data)return {id,exists:false,data:()=>({})};
  const {id:_omit,...rest}=data;
  return {id,exists:true,data:()=>rest};
}

// Signature per collection / meta document, recomputed once per poll. Listeners
// compare against it so an unchanged poll costs nothing: without this, every tab
// would rebuild on a 20s timer, which on the Goals grid means a 1MB re-render that
// throws away whatever the user was typing.
let SNAP_SIGS={};
function computeSnapshotSignatures(){
  const sigs={};
  Object.keys(SNAP.collections||{}).forEach(k=>{
    try{sigs['c:'+k]=JSON.stringify(SNAP.collections[k]);}catch(e){sigs['c:'+k]=String(Math.random());}
  });
  Object.keys(SNAP.meta||{}).forEach(k=>{
    try{sigs['m:'+k]=JSON.stringify(SNAP.meta[k]);}catch(e){sigs['m:'+k]=String(Math.random());}
  });
  return sigs;
}

function notifySnapshotListeners(){
  SNAP_SIGS=computeSnapshotSignatures();
  SNAP_LISTENERS.forEach(l=>{
    const sig=l.sigKey?(SNAP_SIGS[l.sigKey]||''):null;
    if(sig!==null&&sig===l.lastSig)return; // nothing this listener cares about moved
    l.lastSig=sig;
    try{l.emit();}catch(e){console.warn('snapshot listener failed:',e);}
  });
}

// Coalesces concurrent callers onto one in-flight request.
async function refreshSnapshot(){
  if(!AUTH_TOKEN)return;
  if(SNAP_INFLIGHT)return SNAP_INFLIGHT;
  SNAP_INFLIGHT=(async()=>{
    try{
      const data=await apiFetch('/snapshot');
      if(data){SNAP={collections:data.collections||{},meta:data.meta||{}};setSyncState('live');notifySnapshotListeners();}
    }catch(e){
      setSyncState('error',e.message);
      throw e;
    }finally{SNAP_INFLIGHT=null;}
  })();
  try{await SNAP_INFLIGHT;}catch(e){/* surfaced through setSyncState */}
}

// Stops the poll loop only. Listeners registered by subAll() are left in place -
// clearing them here would silently detach every view the moment syncing restarted.
function stopPolling(){
  if(SNAP_TIMER){clearInterval(SNAP_TIMER);SNAP_TIMER=null;}
  document.removeEventListener('visibilitychange',onVisibilityRefresh);
}

function startSync(){
  stopPolling();
  refreshSnapshot();
  // Only poll while the tab is actually visible. A backgrounded/forgotten tab polling
  // every few seconds was the main driver of the Firestore read quota being exhausted;
  // hidden tabs now cost nothing and catch up via onVisibilityRefresh when refocused.
  SNAP_TIMER=setInterval(function(){if(!document.hidden)refreshSnapshot();},SNAPSHOT_POLL_MS);
  document.addEventListener('visibilitychange',onVisibilityRefresh);
}

// Full teardown, for logout and session expiry.
function stopSync(){
  stopPolling();
  SNAP_LISTENERS=[];
  SNAP={collections:{},meta:{}};
}

function onVisibilityRefresh(){if(!document.hidden)refreshSnapshot();}

function registerListener(emit,sigKey){
  const entry={emit,sigKey,lastSig:undefined};
  SNAP_LISTENERS.push(entry);
  // Fire immediately if data has already arrived, matching onSnapshot semantics.
  if(Object.keys(SNAP.collections).length){
    entry.lastSig=sigKey?(SNAP_SIGS[sigKey]||''):null;
    try{emit();}catch(e){console.warn('snapshot listener failed:',e);}
  }
  return function unsubscribe(){SNAP_LISTENERS=SNAP_LISTENERS.filter(l=>l!==entry);};
}

// weeklyData ids are `<chapter>_<YYYY-MM-DD>`; chapter names may contain
// underscores, so split from the right.
function splitWeeklyId(docId){
  return {chapter:docId.slice(0,-11),date:docId.slice(-10)};
}

const GENERIC_COLLECTIONS=new Set(['attendance','renewalsDone','visitorPipeline','miyagiMembers']);

async function writeDoc(collection,docId,data,merge){
  if(collection==='meta')return apiFetch('/meta/'+encodeURIComponent(docId),{method:'PUT',body:data});
  if(collection==='chapters')return apiFetch('/chapters',{method:'POST',body:Object.assign({id:docId},data)});
  if(collection==='members')return apiFetch('/members',{method:'POST',body:Object.assign({id:docId},data)});
  if(collection==='weeklyData'){
    const {chapter,date}=splitWeeklyId(docId);
    return apiFetch('/weekly-data/'+encodeURIComponent(chapter)+'/'+encodeURIComponent(date),{method:'PUT',body:data});
  }
  if(GENERIC_COLLECTIONS.has(collection)){
    return apiFetch('/'+collection+'/'+encodeURIComponent(docId),{method:'PUT',body:data});
  }
  throw new Error('Writes to '+collection+' are not permitted');
}

async function deleteDoc(collection,docId){
  if(collection==='members')return apiFetch('/members/'+encodeURIComponent(docId),{method:'DELETE'});
  if(collection==='weeklyData'){
    const {chapter,date}=splitWeeklyId(docId);
    return apiFetch('/weekly-data/'+encodeURIComponent(chapter)+'/'+encodeURIComponent(date),{method:'DELETE'});
  }
  if(GENERIC_COLLECTIONS.has(collection)){
    return apiFetch('/'+collection+'/'+encodeURIComponent(docId),{method:'DELETE'});
  }
  throw new Error('Deletes from '+collection+' are not permitted');
}

function makeDocRef(collection,docId){
  return {
    id:docId,
    async get(){
      await refreshSnapshot();
      if(collection==='meta')return makeDocSnapshot(docId,snapMeta(docId));
      return makeDocSnapshot(docId,snapCollection(collection).find(r=>r.id===docId));
    },
    async set(data,options){
      await writeDoc(collection,docId,data,!(options&&options.merge===false));
      await refreshSnapshot();
    },
    async update(data){
      // Firestore's update() requires an existing document; the API upserts, which is
      // what every call site here actually wants.
      await writeDoc(collection,docId,data,true);
      await refreshSnapshot();
    },
    async delete(){
      await deleteDoc(collection,docId);
      await refreshSnapshot();
    },
    onSnapshot(cb){
      return registerListener(()=>{
        if(collection==='meta')cb(makeDocSnapshot(docId,snapMeta(docId)));
        else cb(makeDocSnapshot(docId,snapCollection(collection).find(r=>r.id===docId)));
      },(collection==='meta'?'m:':'c:')+(collection==='meta'?docId:collection));
    }
  };
}

function makeQueryRef(collection,opts){
  const options=opts||{};
  function rows(){
    let list=snapCollection(collection).slice();
    if(options.orderBy){
      const field=options.orderBy.field,dir=options.orderBy.direction==='desc'?-1:1;
      list.sort((a,b)=>{
        const av=a[field],bv=b[field];
        if(av===bv)return 0;
        if(av===undefined||av===null)return 1;
        if(bv===undefined||bv===null)return -1;
        return (av>bv?1:-1)*dir;
      });
    }
    if(options.limit)list=list.slice(0,options.limit);
    return list;
  }
  return {
    orderBy:(field,direction)=>makeQueryRef(collection,Object.assign({},options,{orderBy:{field,direction}})),
    limit:(n)=>makeQueryRef(collection,Object.assign({},options,{limit:n})),
    async get(){await refreshSnapshot();return makeQuerySnapshot(rows());},
    onSnapshot(cb){return registerListener(()=>cb(makeQuerySnapshot(rows())),'c:'+collection);},
    doc:(docId)=>makeDocRef(collection,docId),
    // Only the activity log is appended to; the server stamps identity and time.
    async add(entry){
      await apiFetch('/activity',{method:'POST',body:{action:entry&&entry.action,details:(entry&&entry.details)||{}}});
    }
  };
}

// ── HTML ESCAPING ──────────────────────────────────────────────────────────
// Everything user-entered (member and visitor names, categories, success stories,
// chapter names, goal text) passes through here before being interpolated into an
// innerHTML string. Without it a name is executable markup.
const _ESC_MAP={'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'};
function esc(v){
  if(v===null||v===undefined)return'';
  return String(v).replace(/[&<>"']/g,function(c){return _ESC_MAP[c];});
}
// For values placed inside a single-quoted JS string within a double-quoted inline
// handler, e.g. onclick="f('...')". HTML-escaping alone is not enough there: the
// parser decodes entities before the JS is compiled, so a quoted entity would still
// break out. Escape for JS first, then for HTML, leaving the JS backslash intact.
function jsArg(v){
  return String(v===null||v===undefined?'':v)
    .replace(/\\/g,'\\\\')
    .replace(/'/g,"\\'")
    .replace(/\r?\n/g,'\\n')
    .replace(/&/g,'&amp;')
    .replace(/"/g,'&quot;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;');
}

// ── LOCAL DATE HELPERS ─────────────────────────────────────────────────────
// toISOString() converts to UTC, which in IST (UTC+5:30) returns yesterday's date
// before 05:30 local. These keep calendar maths in the user's own timezone.
function toLocalISODate(d){
  const dt=d||new Date();
  const y=dt.getFullYear();
  const m=String(dt.getMonth()+1).padStart(2,'0');
  const day=String(dt.getDate()).padStart(2,'0');
  return y+'-'+m+'-'+day;
}
function todayISO(){return toLocalISODate(new Date());}

function getWeekTueFri(dateStr){
  const raw=dateStr.includes('T')?dateStr:dateStr+'T00:00:00';
  const d=new Date(raw);
  const day=d.getDay();
  const tueDiff=day>=2?day-2:day+5;
  const tue=new Date(raw);tue.setDate(d.getDate()-tueDiff);
  const fri=new Date(raw);fri.setDate(d.getDate()-tueDiff+3);
  const fmt=dt=>{const y=dt.getFullYear();const m=String(dt.getMonth()+1).padStart(2,'0');const dd=String(dt.getDate()).padStart(2,'0');return y+'-'+m+'-'+dd;};
  return{tue:fmt(tue),fri:fmt(fri)};
}

function getWeekKey(dateStr){return getWeekTueFri(dateStr).tue;}

function fmtWeekChip(weekKey){
  const{tue,fri}=getWeekTueFri(weekKey);
  const t=new Date(tue+'T00:00:00'),f=new Date(fri+'T00:00:00');
  const tm=t.toLocaleDateString('en-IN',{day:'numeric',month:'short'});
  const fm=f.toLocaleDateString('en-IN',{day:'numeric',month:'short'});
  return tm+' - '+fm;
}

function getCurrentWeekKey(){
  const today=new Date();
  return getWeekKey(todayISO());
}

function getWeeks(){
  const keys=[...new Set(S.weeklyData.map(e=>getWeekKey(e.date)))].sort().reverse();
  // Always include current week even if no data
  const curr=getCurrentWeekKey();
  if(!keys.includes(curr))keys.unshift(curr);
  return keys;
}

// BOOT ──
async function boot(){
  try{loadBranding();}catch(e){console.warn('Branding load failed:',e);}
  var previewMode=new URLSearchParams(location.search).get('preview');
  if(previewMode==='tlr'){
    await startLocalTlrPreview();
    return;
  }
  if(previewMode==='login'){
    await startLocalLoginPreview();
    return;
  }
  if(['srdc','dc','sa1','sa2'].includes(previewMode)){
    startSrdcPreview(previewMode);
    return;
  }
  setSyncState('connecting');
  try{
    await buildLoginDD();
    setSyncState('live');
  }catch(e){
    console.error('Boot error:',e);
    setSyncState('offline');
    // Offer the built-in hierarchy so the screen is not blank, but make it clear
    // these entries cannot authenticate against an unreachable backend.
    try{await seedData(false);renderLoginMembers(SEED_LOGIN_MEMBERS,{offline:true});}
    catch(seedErr){console.warn('Built-in hierarchy unavailable:',seedErr);}
  }
  hide('loaderScreen');show('loginScreen');
  applyBranding();
}

// TEAM_ID: hardcoded to 'bni_chapter_pulse' for now. Every activityLog write is tagged with this
// so that when the region build adds real multi-team scoping, existing log data already
// carries a team field and doesn't need a backfill migration.
const TEAM_ID='bni_chapter_pulse';

// Generic activity logger. Call after any state-changing action. Never blocks or throws
// into the caller - logging failures are swallowed so they can't break the actual save.
async function logActivity(action,details){
  if(isOfflinePreviewParam()||isLocalPreviewMode())return;
  try{
    await db.collection('activityLog').add({
      team:TEAM_ID,
      action:action,
      details:details||{},
      userName:S.user?S.user.name:'unknown',
      userRole:S.user?S.user.role:'unknown',
      chapter:S.user?(S.user.chapter||(S.user.chapters&&S.user.chapters[0])||null):null,
      timestamp:new Date().toISOString()
    });
  }catch(e){console.warn('Activity log failed:',e);}
}

async function buildLoginDD(){
  // Dedicated unauthenticated endpoint returning names and roles only - no PINs,
  // no hashes, and none of the other member fields.
  const payload=await apiFetch('/auth/login-directory');
  renderLoginMembers((payload&&payload.members)||[]);
}

function isOfflinePreviewParam(){
  try{return new URLSearchParams(location.search).get('preview')==='tlr';}
  catch(e){return false;}
}

function renderLoginMembers(rawMembers,opts){
  const sel=document.getElementById('loginName');
  if(!sel)return;
  sel.innerHTML='<option value="">-- Select Your Name --</option>';
  if(opts&&opts.offline){
    const warn=document.createElement('option');
    warn.value='';warn.disabled=true;
    warn.textContent='(Offline - sign-in unavailable until the server is reachable)';
    sel.appendChild(warn);
  }
  const byChap={};
  const seen={};
  rawMembers.forEach(m=>{
    m=Object.assign({},m);
    m.name=(m.name||'').trim();
    m.role=(m.role||'').trim().toLowerCase();
    m.chapters=(m.chapters||[]).filter(function(ch){return(ch||'').trim();});
    m.chapter=(m.chapter||m.chapters[0]||'').trim();
    if(!m.name||!m.role)return;
    const ch=m.role==='ad'?'Whole Region Access':m.role==='srdc'?'Senior Directors':m.role==='viewer'?'Viewers':(m.chapter||m.chapters[0]||'Chapter Not Assigned');
    const key=m.id||[m.name,m.role,ch].join('|').toLowerCase();
    if(seen[key])return;
    seen[key]=true;
    if(!byChap[ch])byChap[ch]=[];
    byChap[ch].push(m);
  });
  Object.keys(byChap).sort(function(a,b){
    const groupOrder={'Whole Region Access':0,'Senior Directors':1,'Viewers':2};
    const go=(groupOrder[a]??9)-(groupOrder[b]??9);
    if(go)return go;
    return a.localeCompare(b);
  }).forEach(ch=>{
    const g=document.createElement('optgroup');g.label=ch;
    byChap[ch].sort(function(a,b){
      const roleOrder={ad:0,srdc:1,viewer:2,dc:3,cd:3,sa1:4,sa2:5};
      const ro=(roleOrder[a.role]??9)-(roleOrder[b.role]??9);
      return ro||a.name.localeCompare(b.name);
    }).forEach(m=>{
      const chapters=(m.chapters&&m.chapters.length)?m.chapters:(m.chapter?[m.chapter]:[]);
      const details=[rl(m.role)];
      if(chapters.length)details.push(chapters.join(', '));
      if(m.reportsTo)details.push('Reports to '+m.reportsTo);
      const o=document.createElement('option');
      o.value=m.id;
      o.textContent=m.name+' - '+details.join(' - ');
      g.appendChild(o);
    });
    sel.appendChild(g);
  });
  // Master fallback sign-in. The PIN lives hashed in meta/config and is changed from
  // Settings; this is the account that entry documents as the first-run fallback.
  if(!opts||!opts.offline){
    const mg=document.createElement('optgroup');mg.label='Master Access';
    const mo=document.createElement('option');
    mo.value='__srdc__';
    mo.textContent='Sr. DC Master Login - Senior Director';
    mg.appendChild(mo);sel.appendChild(mg);
  }
  sel.onchange=()=>{
    const v=sel.value!=='';
    document.getElementById('pinGroup').classList.toggle('hidden',!v);
    document.getElementById('loginErr').classList.add('hidden');
    if(v)setTimeout(()=>document.getElementById('loginPin').focus(),50);
  };
}

async function doLogin(){
  const nv=document.getElementById('loginName').value;
  const pin=document.getElementById('loginPin').value;
  if(!nv||!pin){toast('Select name and enter PIN');return;}
  let m=null;
  if(S.localPreview){
    // Offline demo data only; no real records are reachable in this mode.
    if(pin!==PREVIEW_MEMBER_PIN){showLoginErr();return;}
    m=SEED_LOGIN_MEMBERS.find(function(x){return x.id===nv;});
    if(!m){showLoginErr();return;}
    m=Object.assign({},m);
  }else{
    // The server is the only authority on credentials. There is no local fallback:
    // if it cannot verify the PIN, sign-in fails.
    const btn=document.getElementById('loginBtn');
    if(btn){btn.disabled=true;btn.textContent='Signing in...';}
    try{
      const payload=await apiFetch('/auth/login',{method:'POST',body:{memberId:nv,pin:pin}});
      if(!payload||!payload.user||!payload.token){showLoginErr();return;}
      setAuthToken(payload.token);
      m=payload.user;
    }catch(e){
      console.warn('Login failed:',e);
      showLoginErr(e&&e.message&&!/incorrect pin/i.test(e.message)?e.message:'');
      return;
    }finally{
      if(btn){btn.disabled=false;btn.textContent='Sign In';}
    }
  }
  S.user={id:nv,name:m.name,role:m.role,chapter:m.chapter,chapters:m.chapters||[m.chapter],reportsTo:m.reportsTo||'',chapterReportsTo:m.chapterReportsTo||{},seniorDirectorId:m.seniorDirectorId||'',areaDirectorId:m.areaDirectorId||''};
  ensureUserChapterScope();
  document.getElementById('loginPin').value='';
  document.getElementById('loginErr').classList.add('hidden');
  startApp();
}
function showLoginErr(detail){
  const el=document.getElementById('loginErr');
  el.classList.remove('hidden');
  if(detail)el.textContent=detail;
  document.getElementById('loginPin').value='';
  document.getElementById('loginPin').focus();
}
function logout(){
  S.unsubs.forEach(u=>u());S.unsubs=[];
  stopSync();
  setAuthToken(null);
  S.user=null;
  hide('app');show('loginScreen');
  document.getElementById('loginPin').value='';
  document.getElementById('pinGroup').classList.add('hidden');
  document.getElementById('loginName').value='';
}

function startApp(){
  hide('loginScreen');show('app');
  setTimeout(function(){
    var mc=document.getElementById('mainContent');
    if(mc&&!mc.dataset.sortObserverAttached){
      mc.dataset.sortObserverAttached='1';
      _sortObserver.observe(mc,{childList:true,subtree:true});
      makeSortable();
    }
  },100);
  const role=S.user.role;
  const isSd=['ad','srdc'].includes(role);
  const isViewer=role==='viewer';
  const isDC=['cd','dc','sa1','sa2'].includes(role);
  document.getElementById('userChip').textContent=(isSd?'* ':'')+S.user.name+' - Logout';
  loadBranding();
  ensureUserChapterScope();
  // Set active chapter for DC
  if(isDC) S.dcActiveChapter=S.user.chapters?.[0]||S.user.chapter;
  // Build nav
  buildNav();
  if(isLocalPreviewMode())refresh();
  else subAll();
  switchTab('overview');
}

async function prepareLocalPreviewData(){
  try{await seedData(false);}catch(e){console.warn('Local preview seed failed:',e);}
  S.localPreview=true;
  S.chapters=SEED_CHAPTERS.slice();
  S.members=SEED_LOGIN_MEMBERS.slice();
  var fileTlrRows=await loadLocalTlrRows();
  var fileDuesRows=await loadLocalDuesRows();
  var stored=loadLocalPreviewState();
  S.tlrData=fileTlrRows.length?fileTlrRows:((stored.tlrData&&stored.tlrData.length)?stored.tlrData:[]);
  S.weeklyData=stored.weeklyData||[];
  applyLocalTlrRowsToWeekly(S.tlrData,S.weeklyData);
  var previewDate=localTlrPreviewDate(S.tlrData);
  var storedDues=stored.duesData||[];
  S.duesData=uniqueDuesMembers(fileDuesRows.length?fileDuesRows:(storedDues.length?storedDues:buildDemoDuesData(S.chapters)));
  S.renewalsDone=stored.renewalsDone||{};
  S.lomData=stored.lomData||[];
  S.visitorPipeline=stored.visitorPipeline||[];
  S.ovWeek=getWeekKey(previewDate);
  saveLocalPreviewState();
}

function isLocalPreviewMode(){
  return !!S.localPreview||(S.user&&S.user.id==='local-tlr-preview');
}

function localPreviewKey(){
  return'bniPulseLocalPreviewState';
}

function loadLocalPreviewState(){
  try{return JSON.parse(localStorage.getItem(localPreviewKey())||'{}')||{};}
  catch(e){return{};}
}

function saveLocalPreviewState(){
  if(!isLocalPreviewMode())return;
  try{
    localStorage.setItem(localPreviewKey(),JSON.stringify({
      weeklyData:S.weeklyData||[],
      tlrData:S.tlrData||[],
      duesData:S.duesData||[],
      renewalsDone:S.renewalsDone||{},
      lomData:S.lomData||[],
      visitorPipeline:S.visitorPipeline||[]
    }));
  }catch(e){console.warn('Local preview save failed:',e);}
}

function saveLocalWeeklyEntry(entry,visitorRows){
  var idx=S.weeklyData.findIndex(function(e){return e.chapter===entry.chapter&&e.date===entry.date;});
  if(idx>=0)S.weeklyData[idx]=Object.assign({},S.weeklyData[idx],entry);
  else S.weeklyData.unshift(entry);
  (visitorRows||[]).forEach(function(row){
    var existing=S.visitorPipeline.findIndex(function(p){return p.id===row.id;});
    if(existing>=0)S.visitorPipeline[existing]=Object.assign({},S.visitorPipeline[existing],row);
    else S.visitorPipeline.push(row);
  });
  saveLocalPreviewState();
  refresh();
}

function localTlrPreviewDate(rows){
  var month=(rows&&rows[0]&&rows[0].reportMonth)||'Jul-2026';
  var m=String(month).match(/^([A-Za-z]{3})-(\d{4})$/);
  var months={jan:'01',feb:'02',mar:'03',apr:'04',may:'05',jun:'06',jul:'07',aug:'08',sep:'09',oct:'10',nov:'11',dec:'12'};
  if(!m)return'2026-07-31';
  var mon=months[m[1].toLowerCase()]||'07';
  var d=new Date(+m[2],+mon,0);
  return m[2]+'-'+mon+'-'+String(d.getDate()).padStart(2,'0');
}

function buildDemoDuesData(chapters){
  var industries=['Consulting','Real Estate','Finance','Manufacturing','Digital Marketing','Education','Healthcare','IT Services','Architecture','Legal Services','Travel','Food Services'];
  var firstNames=['Aarav','Diya','Mihir','Kavya','Rohan','Nisha','Parth','Isha','Dev','Riya','Kunal','Meera','Jay','Anaya','Harsh','Priya'];
  var lastNames=['Shah','Patel','Mehta','Desai','Trivedi','Kapadia','Joshi','Thakkar','Bhatt','Parekh','Vora','Dave','Soni','Shroff','Nanavati','Dalal'];
  return(chapters||[]).flatMap(function(ch,i){
    return[0,1].map(function(slot){
      var due=new Date(2026,7,16);
      due.setDate(due.getDate()+((i*5)+(slot*29))%88);
      var name=firstNames[(i+slot)%firstNames.length]+' '+lastNames[(i*2+slot)%lastNames.length];
      return{
        chapter:ch.name,
        name:name,
        industry:industries[(i+slot)%industries.length],
        type:slot===0?'Annual':'Renewal',
        status:'Active',
        dueDate:toLocalISODate(due),
        demo:true
      };
    });
  });
}

function buildLocalTlrWeeklyRows(rows,date){
  return(rows||[]).map(function(r){
    var size=Math.round(parseFloat(r.chapterSize)||0);
    return{
      chapter:r.name,
      date:date,
      filledBy:'TLR PDF Import',
      filledByRole:'local-preview',
      visitors_list:[],
      membersStart:size,
      inductions:0,
      drops:0,
      membersClose:size,
      membersConnect:size,
      visitors:Math.round(parseFloat(r.avgVisitors||r.visitors||r.lastMonthVisitors)||0),
      posVisitors:0,
      concall:'Yes',
      tlr:parseFloat(r.score)||0,
      onetwentyone:0,
      references:Math.round(parseFloat(r.avgReferrals||r.referrals||r.lastMonthReferrals)||0),
      tyfcb:Math.round(parseFloat(r.tyfcb||r.lastMonthBusinessPassed||r.avgBusinessPassed)||0),
      eoiYes:0,
      eoiMaybe:0,
      eoiNo:0,
      eoiPending:0,
      pipeline:0,
      renewals:0,
      successStory:'Local PDF TLR preview',
      savedAt:new Date().toISOString()
    };
  });
}

function isLocalTlrSyntheticEntry(e){
  return e&&e.filledByRole==='local-preview'&&e.successStory==='Local PDF TLR preview';
}

function applyLocalTlrRowsToWeekly(rows,existingRows){
  var previewDate=localTlrPreviewDate(rows);
  var tlrRows=buildLocalTlrWeeklyRows(rows,previewDate);
  var manualRows=(existingRows||S.weeklyData||[]).filter(function(e){
    return !isLocalTlrSyntheticEntry(e);
  });
  var manualKeys={};
  manualRows.forEach(function(e){manualKeys[e.chapter+'_'+e.date]=1;});
  S.weeklyData=tlrRows.filter(function(e){return !manualKeys[e.chapter+'_'+e.date];}).concat(manualRows);
  S.ovWeek=getWeekKey(previewDate);
}

function subAll(){
  const u1=db.collection('chapters').orderBy('order').onSnapshot(s=>{S.chapters=s.docs.map(d=>({id:d.id,...d.data()}));ensureUserChapterScope();popSelects();refresh();});
  const u2=db.collection('members').onSnapshot(s=>{S.members=s.docs.map(d=>({id:d.id,...d.data()}));ensureUserChapterScope();popSelects();if(S.tab==='settings')renderSettings();});
  const u3=db.collection('weeklyData').orderBy('date','desc').onSnapshot(s=>{S.weeklyData=s.docs.map(d=>({id:d.id,...d.data()}));refresh();});
  const u4=db.collection('meta').doc('dues').onSnapshot(d=>{if(d.exists){S.duesData=d.data().members||[];if(S.tab==='renewals')renderRenewals();if(S.tab==='retention')renderAreaDirectorRetentionTab();}});
  const u5=db.collection('meta').doc('tlr').onSnapshot(async d=>{
    var localRows=await loadLocalTlrRows();
    if(localRows.length){
      S.tlrData=localRows;
      refresh();
      if(S.tab==='tlr')renderTLR();
      return;
    }
    if(d.exists){S.tlrData=d.data().rows||[];const dt=d.data().uploadedAt||'';refresh();if(S.tab==='tlr')renderTLR();}
  });
  const u6=db.collection('attendance').onSnapshot(s=>{S.attendance={};s.docs.forEach(d=>{S.attendance[d.id]=d.data();});if(S.tab==='call')renderCallMode();});
  const u7=db.collection('renewalsDone').onSnapshot(s=>{S.renewalsDone={};s.docs.forEach(d=>{S.renewalsDone[d.id]=d.data();});if(S.tab==='renewals')renderRenewals();});
  const u8=db.collection('meta').doc('monthlyTargets').onSnapshot(d=>{if(d.exists)S.monthlyTargets=d.data();else S.monthlyTargets={};});
  const u9=db.collection('visitorPipeline').onSnapshot(s=>{S.visitorPipeline=s.docs.map(d=>({id:d.id,...d.data()}));if(S.tab==='pipeline')renderPipelineVelocity();});
  const u10=db.collection('miyagiMembers').onSnapshot(s=>{S.miyagiMembers=s.docs.map(d=>({id:d.id,...d.data()}));if(S.tab==='miyagi')renderMiyagiTab();if(S.tab==='call')renderCallContent();});
  const u11=db.collection('meta').doc('lengthOfMembership').onSnapshot(d=>{if(d.exists)S.lomData=d.data().rows||[];});
  const u12=db.collection('activityLog').orderBy('timestamp','desc').limit(500).onSnapshot(s=>{S.activityLog=s.docs.map(d=>({id:d.id,...d.data()}));if(S.tab==='activitylog')renderActivityLogTab();});
  const u13=db.collection('meta').doc('config').onSnapshot(d=>{S.srCallDay=(d.exists&&d.data().srCallDay)||'Friday';if(S.tab==='reports')renderReportContent();if(S.tab==='settings')renderSettings();});
  // Assign before subGoals() pushes onto the list - the previous order threw away
  // the goals unsubscribe, leaking that listener on every logout.
  S.unsubs=[u1,u2,u3,u4,u5,u6,u7,u8,u9,u10,u11,u12,u13];
  subGoals();
  startSync();
  // Load branding after subscriptions are set up
  try{loadBranding();}catch(e){console.warn('Branding load failed:',e);}
}

function isLocalTlrMode(){
  return['localhost','127.0.0.1'].includes(location.hostname);
}

var LOCAL_TLR_ROWS_PROMISE=null;
async function loadLocalTlrRows(){
  if(!isLocalTlrMode())return[];
  if(!LOCAL_TLR_ROWS_PROMISE){
    LOCAL_TLR_ROWS_PROMISE=fetch('local-tlr-data.json?v='+(new Date().getTime()),{cache:'no-store'})
      .then(function(r){return r.ok?r.json():null;})
      .then(function(d){return d&&Array.isArray(d.rows)?d.rows:[];})
      .catch(function(){return[];});
  }
  return LOCAL_TLR_ROWS_PROMISE;
}

var LOCAL_DUES_ROWS_PROMISE=null;
async function loadLocalDuesRows(){
  if(!isLocalTlrMode())return[];
  if(!LOCAL_DUES_ROWS_PROMISE){
    LOCAL_DUES_ROWS_PROMISE=fetch('local-dues-data.json?v='+(new Date().getTime()),{cache:'no-store'})
      .then(function(r){return r.ok?r.json():null;})
      .then(function(d){return d&&Array.isArray(d.members)?d.members:[];})
      .catch(function(){return[];});
  }
  return LOCAL_DUES_ROWS_PROMISE;
}

function switchTab(t){
  S.tab=t;
  closeDrill();
  document.querySelectorAll('.nt').forEach(x=>x.classList.toggle('active',x.dataset.tab===t));
  const activeTab=document.querySelector('.nt.active');if(activeTab)activeTab.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});
  const mc=document.getElementById('mainContent');
  mc.innerHTML='';
  const div=document.createElement('div');div.id='tab-'+t;mc.appendChild(div);
  if(t==='overview')renderOverview();
  else if(t==='entry')renderEntry();
  else if(t==='call')renderCallMode();
  else if(t==='renewals')renderRenewals();
  else if(t==='retention')renderAreaDirectorRetentionTab();
  else if(t==='tlr')renderTLR();
  else if(t==='reports')renderReportTab();
  else if(t==='planning')renderPlanningTab();
  else if(t==='radar')renderRiskRadar();
  else if(t==='pipeline')renderPipelineVelocity();
  else if(t==='miyagi')renderMiyagiTab();
  else if(t==='sdreport')renderSDReport();
  else if(t==='retro')renderRetroTab();
  else if(t==='goals')renderGoalsTab();
  else if(t==='upload')renderUpload();
  else if(t==='activitylog')renderActivityLogTab();
  else if(t==='settings')renderSettings();
}

function popSelects(){
  const scopedChapters=S.user?visibleChapters():S.chapters;
  const opts=scopedChapters.map(c=>`<option value="${esc(c.name)}">${esc(c.name)}</option>`).join('');
  const ec=document.getElementById('eChapter');
  if(ec){const pv=ec.value;ec.innerHTML=opts;
    if(isSrdc()||isViewer()){if(pv)ec.value=pv;}
    else{ec.value=S.dcActiveChapter||S.user?.chapter||'';ec.disabled=true;}}
  const mc=document.getElementById('mChapter');if(mc)mc.innerHTML=opts;
  const mch2=document.getElementById('mChapters');
  if(mch2){mch2.innerHTML=opts;}

function isAreaDirector(){return S.user?.role==='ad';}
function isSeniorDirector(){return S.user?.role==='srdc';}
function isSrdc(){return['ad','srdc'].includes(S.user?.role);}
function isViewer(){return S.user?.role==='viewer';}
function isChapterDirectorRole(role){return['cd','dc'].includes(role);}
function isDC(){return['cd','dc','sa1','sa2'].includes(S.user?.role);}
function roleClass(role){return role==='ad'?'ad':role==='srdc'?'srdc':isChapterDirectorRole(role)?'dc':role==='viewer'?'viewer':'sa';}
function normPersonName(value){return String(value||'').toLowerCase().replace(/\bpvt\b/g,'private').replace(/\bltd\b/g,'limited').replace(/[^a-z0-9]+/g,' ').trim();}
function uniqueList(values){return[...new Set((values||[]).filter(Boolean))];}
function seniorMappedChapters(name){
  var key=normPersonName(name);
  if(!key)return[];
  return S.chapters.filter(function(ch){return normPersonName(ch.seniorDirector)===key;}).map(function(ch){return ch.name;});
}
function ensureUserChapterScope(){
  if(!S.user)return;
  if(isSeniorDirector()){
    var assigned=uniqueList([...(S.user.chapters||[]),...seniorMappedChapters(S.user.name)]);
    S.user.chapters=assigned;
    S.user.chapter=assigned[0]||S.user.chapter||'';
  }else if(isDC()){
    S.user.chapters=uniqueList(S.user.chapters&&S.user.chapters.length?S.user.chapters:[S.user.chapter]);
    S.user.chapter=S.user.chapter||S.user.chapters[0]||'';
    S.dcActiveChapter=S.dcActiveChapter||S.user.chapter||S.user.chapters[0]||'';
  }
}
function myChapters(){
  if(isAreaDirector()||isViewer())return S.chapters.map(c=>c.name);
  if(isSeniorDirector())return uniqueList([...(S.user?.chapters||[]),...seniorMappedChapters(S.user?.name)]);
  return(S.user?.chapters&&S.user.chapters.length)?S.user.chapters:(S.user?.chapter?[S.user.chapter]:[]);
}
function visibleChapterNames(){return myChapters().filter(Boolean);}
function visibleChapters(){
  const names=visibleChapterNames();
  return S.chapters.filter(function(c){return names.includes(c.name);});
}
function chapterSeniorDirectorName(ch){
  return(ch.seniorDirector||'').trim();
}
function chapterDirectorName(ch){
  if(ch&&ch.chapterDirector)return ch.chapterDirector;
  var dc=S.members.find(function(m){return(m.chapters||[m.chapter]).includes(ch.name)&&isChapterDirectorRole(m.role);});
  return dc?dc.name:'-';
}
// The people who run a chapter: its Director plus the two Ambassadors. Ambassadors
// (roles sa1/sa2) have the same rights as the Director; this is purely for display.
function chapterTeam(chName){
  var mems=S.members.filter(function(m){return(m.chapters||[m.chapter]).includes(chName);});
  return{
    director:mems.find(function(m){return isChapterDirectorRole(m.role);})||null,
    launchAmbassador:mems.find(function(m){return m.role==='sa1';})||null,
    supportAmbassador:mems.find(function(m){return m.role==='sa2';})||null
  };
}
// "Director · SA1 · SA2" one-liner for chapter headers/summaries.
function chapterTeamSummary(chName,opts){
  var t=chapterTeam(chName);
  var parts=[];
  var dcName=t.director?t.director.name:(function(){var c=S.chapters.find(function(x){return x.name===chName;});return c?chapterDirectorName(c):'-';})();
  parts.push('<span class="tm">Director:</span> '+esc(dcName||'-'));
  if(t.launchAmbassador)parts.push('<span class="tm">SA1:</span> '+esc(t.launchAmbassador.name));
  if(t.supportAmbassador)parts.push('<span class="tm">SA2:</span> '+esc(t.supportAmbassador.name));
  return parts.join((opts&&opts.sep)||' &nbsp;·&nbsp; ');
}
function seniorDirectorOptionsForChapters(chapters){
  var seen={};
  return chapters.map(chapterSeniorDirectorName).filter(function(name){
    if(!name||seen[name])return false;
    seen[name]=true;
    return true;
  }).sort(function(a,b){return a.localeCompare(b);});
}
function areaFilteredChapters(chapters){
  if(!isAreaDirector())return chapters;
  var q=(S.adOverviewChapterFilter||'').trim().toLowerCase();
  var senior=(S.adOverviewSeniorFilter||'').trim();
  return chapters.filter(function(ch){
    var matchesChapter=!q||ch.name.toLowerCase().includes(q)||chapterDirectorName(ch).toLowerCase().includes(q);
    var matchesSenior=!senior||chapterSeniorDirectorName(ch)===senior;
    return matchesChapter&&matchesSenior;
  });
}
function renderAreaDirectorOverviewFilters(allChapters,visibleCount,rerenderFn){
  if(!isAreaDirector())return'';
  rerenderFn=rerenderFn||'renderOverview';
  var seniors=seniorDirectorOptionsForChapters(allChapters);
  var q=(S.adOverviewChapterFilter||'').replace(/"/g,'&quot;');
  var senior=S.adOverviewSeniorFilter||'';
  return`
    <div class="card" style="margin-bottom:14px;">
      <div class="sec-hdr"><div class="sec-title">Area Director Filters</div><span class="tm">${visibleCount}/${allChapters.length} chapters shown</span></div>
      <div class="ad-filter-grid">
        <div class="fg" style="margin:0;"><label>Search Chapter / Director</label><input type="text" value="${q}" placeholder="Chapter or Director name" oninput="S.adOverviewChapterFilter=this.value;clearTimeout(window._adFilterTimer);window._adFilterTimer=setTimeout(${rerenderFn},250)"></div>
        <div class="fg" style="margin:0;"><label>Senior Director</label><select onchange="S.adOverviewSeniorFilter=this.value;${rerenderFn}()">
          <option value="">All Senior Directors</option>
          ${seniors.map(function(name){return`<option value="${name.replace(/"/g,'&quot;')}"${senior===name?' selected':''}>${name}</option>`;}).join('')}
        </select></div>
        <button class="btn btn-sm" style="height:38px;" onclick="S.adOverviewChapterFilter='';S.adOverviewSeniorFilter='';${rerenderFn}()">Clear</button>
      </div>
    </div>`;
}

function renderAreaDirectorTargets(totalMembers,scoreChapters){
  var memberPct=AREA_DIRECTOR_TOTAL_SCORE_TARGET?Math.min(100,Math.round((totalMembers/AREA_DIRECTOR_TOTAL_SCORE_TARGET)*100)):0;
  var memberGap=Math.max(0,AREA_DIRECTOR_TOTAL_SCORE_TARGET-totalMembers);
  var supportStart=new Date();
  supportStart=new Date(supportStart.getFullYear(),supportStart.getMonth(),1);
  scoreChapters=scoreChapters||visibleChapters();
  function isoDate(d){return new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())).toISOString().split('T')[0];}
  function supportMovementForRange(startIso,endIso){
    var movement={inductions:0,drops:0};
    (scoreChapters||[]).forEach(function(ch){
      var latestByWeek={};
      getCascadedEntries(ch.name).forEach(function(e){
        if(e.date<startIso||e.date>endIso)return;
        var key=getWeekKey(e.date);
        if(!latestByWeek[key]||e.date>latestByWeek[key].date)latestByWeek[key]=e;
      });
      Object.values(latestByWeek).forEach(function(e){
        movement.inductions+=+e.inductions||0;
        movement.drops+=+e.drops||0;
      });
    });
    movement.net=movement.inductions-movement.drops;
    return movement;
  }
  var supportQuarters=[];
  for(var qi=0;qi<AREA_DIRECTOR_SUPPORT_QUARTER_COUNT;qi++){
    var qStart=new Date(supportStart.getFullYear(),supportStart.getMonth()+(qi*3),1);
    var qEnd=new Date(supportStart.getFullYear(),supportStart.getMonth()+(qi*3)+3,0);
    var qStartIso=isoDate(qStart);
    var qEndIso=isoDate(qEnd);
    var qMonths=[];
    for(var mi=0;mi<3;mi++){
      var d=new Date(supportStart.getFullYear(),supportStart.getMonth()+(qi*3)+mi,1);
      qMonths.push(MONTH_SHORT[d.getMonth()]+' '+String(d.getFullYear()).slice(-2));
    }
    var movement=supportMovementForRange(qStartIso,qEndIso);
    var actual=movement.inductions;
    var gap=Math.max(0,AREA_DIRECTOR_SUPPORT_QUARTER_TARGET-actual);
    var pct=Math.min(100,Math.round((actual/AREA_DIRECTOR_SUPPORT_QUARTER_TARGET)*100));
    supportQuarters.push({label:'Q'+(qi+1),months:qMonths,start:qStartIso,end:qEndIso,target:AREA_DIRECTOR_SUPPORT_QUARTER_TARGET,actual:actual,drops:movement.drops,net:movement.net,gap:gap,pct:pct});
  }
  var supportActual=supportQuarters.reduce(function(s,q){return s+q.actual;},0);
  var supportDrops=supportQuarters.reduce(function(s,q){return s+q.drops;},0);
  var supportNet=supportActual-supportDrops;
  var runningSupportNet=0;
  supportQuarters.forEach(function(q){
    runningSupportNet+=q.net;
    q.cumulativeNet=runningSupportNet;
  });
  var supportYearPct=AREA_DIRECTOR_SUPPORT_YEAR_TARGET?Math.min(100,Math.round((supportActual/AREA_DIRECTOR_SUPPORT_YEAR_TARGET)*100)):0;
  var supportStartLabel=MONTH_SHORT[supportStart.getMonth()]+' '+supportStart.getFullYear();
  var supportNetColor=supportNet>=0?'var(--green)':'var(--red)';
  var netRangeOptions=[
    {value:'30d',label:'30 days',days:30},
    {value:'60d',label:'60 days',days:60},
    {value:'90d',label:'90 days',days:90},
    {value:'6m',label:'6 months',months:6},
    {value:'12m',label:'12 months',months:12}
  ];
  var netWindowRange=S.adNetWindowRange||((+S.adNetWindowDays||90)+'d');
  var netWindowOpt=netRangeOptions.find(function(o){return o.value===netWindowRange;})||netRangeOptions[2];
  var netWindowEnd=new Date(todayISO()+'T00:00:00');
  var netWindowStart=new Date(netWindowEnd);
  if(netWindowOpt.months){
    netWindowStart.setMonth(netWindowStart.getMonth()-netWindowOpt.months);
    netWindowStart.setDate(netWindowStart.getDate()+1);
  }else{
    netWindowStart.setDate(netWindowStart.getDate()-(netWindowOpt.days-1));
  }
  var netWindowMovement=supportMovementForRange(isoDate(netWindowStart),isoDate(netWindowEnd));
  var netWindowColor=netWindowMovement.net>=0?'var(--green)':'var(--red)';
  var netWindowSelect='<select style="width:auto;min-width:122px;padding:6px 10px;font-size:12px;border:1.5px solid var(--border);border-radius:8px;background:#fff;" onchange="S.adNetWindowRange=this.value;S.adNetWindowDays=parseInt(this.value,10)||90;renderOverview()">'+netRangeOptions.map(function(o){return'<option value="'+o.value+'"'+(netWindowOpt.value===o.value?' selected':'')+'>'+o.label+'</option>';}).join('')+'</select>';
  return`
    <div class="card" style="margin-bottom:14px;">
      <div class="sec-hdr"><div class="sec-title">Area Director Targets</div><span class="tm">Support year starts ${supportStartLabel}</span></div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;">
        <div style="background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:14px;">
          <div style="font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;">Total Members / Score</div>
          <div style="display:flex;align-items:flex-end;gap:7px;margin-top:6px;">
            <div style="font-size:30px;font-weight:900;color:var(--navy);line-height:1;">${totalMembers}</div>
            <div style="font-size:15px;font-weight:800;color:var(--muted);padding-bottom:2px;">/ ${AREA_DIRECTOR_TOTAL_SCORE_TARGET}</div>
          </div>
          <div style="height:8px;background:#e5e7eb;border-radius:999px;overflow:hidden;margin-top:10px;">
            <div style="height:100%;width:${memberPct}%;background:var(--green);border-radius:999px;"></div>
          </div>
          <div style="display:flex;justify-content:space-between;margin-top:7px;font-size:11px;color:var(--muted);">
            <span>${memberPct}% achieved</span><span>${memberGap} gap</span>
          </div>
        </div>
        <div style="background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:14px;">
          <div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start;">
            <div>
              <div style="font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;">Cumulative Net Added</div>

function renderAreaDirectorRetention(chapters){
  if(!isAreaDirector())return'';
  chapters=chapters||visibleChapters();
  var months=+S.adRetentionWindow||12;
  var today=new Date();
  var rangeStart=new Date(today.getFullYear(),today.getMonth()-(months-1),1);
  var rangeEnd=new Date(today.getFullYear(),today.getMonth()+1,0);
  function isoDate(d){return new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())).toISOString().split('T')[0];}
  var from=isoDate(rangeStart);
  var to=isoDate(rangeEnd);
  var chapterNames=chapters.map(function(c){return c.name;});
  var rows=chapters.map(function(ch){
    var due=(S.duesData||[]).filter(function(m){return m.chapter===ch.name&&m.dueDate>=from&&m.dueDate<=to;});
    var done=due.filter(isRenewalDone);
    var pending=due.length-done.length;
    var retention=due.length?Math.round((done.length/due.length)*100):null;
    return{chapter:ch.name,director:chapterDirectorName(ch),senior:chapterSeniorDirectorName(ch),due:due.length,done:done.length,pending:pending,retention:retention};
  }).sort(function(a,b){
    var ar=a.retention===null?-1:a.retention;
    var br=b.retention===null?-1:b.retention;
    return ar-br||b.due-a.due||a.chapter.localeCompare(b.chapter);
  });
  var totalDue=rows.reduce(function(s,r){return s+r.due;},0);
  var totalDone=rows.reduce(function(s,r){return s+r.done;},0);
  var totalPending=totalDue-totalDone;
  var totalRetention=totalDue?Math.round((totalDone/totalDue)*100):0;
  var rangeLabel=fmtD(from)+' to '+fmtD(to);
  var btn=function(n,label){return'<button class="btn btn-sm '+(months===n?'btn-navy':'btn-secondary')+'" onclick="S.adRetentionWindow='+n+';renderAreaDirectorRetentionTab()">'+label+'</button>';};
  return`
    <div class="card" style="margin-bottom:14px;">
      <div class="sec-hdr">
        <div><div class="sec-title">Retention Tracker</div><div class="tm">${rangeLabel} - based on Members Due renewals</div></div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;">${btn(1,'This Month')}${btn(3,'3 Months')}${btn(6,'6 Months')}${btn(12,'12 Months')}</div>
      </div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:9px;margin-bottom:12px;">
        <div class="month-card"><div class="month-lbl">Retention</div><div class="month-val" style="color:${totalRetention>=85?'var(--green)':totalRetention>=70?'var(--amber)':'var(--red)'}">${totalDue?totalRetention+'%':'-'}</div></div>
        <div class="month-card"><div class="month-lbl">Renewals Done</div><div class="month-val">${totalDone}</div></div>
        <div class="month-card"><div class="month-lbl">Renewals Due</div><div class="month-val">${totalDue}</div></div>
        <div class="month-card"><div class="month-lbl">Pending</div><div class="month-val" style="color:${totalPending?'var(--red)':'var(--green)'}">${totalPending}</div></div>
      </div>
      <div style="overflow-x:auto;">
        <table class="rtbl">
          <thead><tr><th>Chapter</th><th>Director</th><th>Senior Director</th><th>Due</th><th>Done</th><th>Pending</th><th>Retention</th></tr></thead>
          <tbody>${rows.map(function(r){
            var col=r.retention===null?'var(--muted)':r.retention>=85?'var(--green)':r.retention>=70?'var(--amber)':'var(--red)';
            return`<tr><td style="font-weight:700">${esc(r.chapter)}</td><td>${esc(r.director)}</td><td>${r.senior||'-'}</td><td>${r.due}</td><td style="color:var(--green);font-weight:700">${r.done}</td><td style="color:${r.pending?'var(--red)':'var(--muted)'}">${r.pending}</td><td style="font-weight:800;color:${col}">${r.retention===null?'-':r.retention+'%'}</td></tr>`;
          }).join('')}</tbody>
        </table>
      </div>
      ${totalDue?'':'<div class="tm mt2">No renewal due data found for the selected period. Upload Members Due data to populate this section.</div>'}
    </div>`;
}

  const curr=S.weeklyData.filter(e=>visNames.includes(e.chapter)&&e.date>=tue&&e.date<=fri).filter(e=>{if(_seen2.has(e.chapter))return false;_seen2.add(e.chapter);return true;}).map(function(e){return getCascadedForWeek(e.chapter,tue,fri)||e;});

// DRILL DOWN (SD only) ──
function openDrill(ch){
  const chObj=S.chapters.find(c=>c.name===ch);
  const entries=getCascadedEntries(ch);
  if(!entries.length){toast('No data for '+ch+' yet');return;}
  const byM={};
  entries.forEach(e=>{const m=e.date.substring(0,7);
    if(!byM[m])byM[m]={net:0,ind:0,drop:0,refs:0,tyfcb:0,vis:0,posVis:0,tlrSum:0,tlrCnt:0};
    byM[m].net+=(+e.inductions||0)-(+e.drops||0);byM[m].ind+=(+e.inductions||0);byM[m].drop+=(+e.drops||0);
    byM[m].refs+=(+e.references||0);byM[m].tyfcb+=(+e.tyfcb||0);byM[m].vis+=(+e.visitors||0);byM[m].posVis+=(+e.posVisitors||0);
    if(+e.tlr>0){byM[m].tlrSum+=(+e.tlr||0);byM[m].tlrCnt++;byM[m].tlrLast=+e.tlr;}
  });
  const months=Object.keys(byM).sort();
  const lastE=entries[entries.length-1];
  const dc=S.members.find(m=>(m.chapters||[m.chapter]).includes(ch)&&isChapterDirectorRole(m.role));
  function barChart(field,color,label,isTYFCB){
    const vals=months.map(m=>byM[m][field]||0);const maxV=Math.max(...vals,1);
    return`<div class="chart-wrap"><div class="chart-title">${label}</div><div class="bar-chart">${months.map((m,i)=>{
      const v=vals[i];const h=Math.max(2,Math.round((v/maxV)*72));
      const col=field==='net'?(v>=0?'var(--green)':'var(--red)'):color;
      const lbl=isTYFCB?fmtL(v):v;
      return`<div class="bar-col"><div class="bar-val">${lbl}</div><div class="bar-fill" style="height:${h}px;background:${col}"></div><div class="bar-lbl">${fmtM(m)}</div></div>`;
    }).join('')}</div></div>`;
  }
  function tlrChart(){
    const vals=months.map(m=>byM[m].tlrCnt>0?Math.round(byM[m].tlrSum/byM[m].tlrCnt):0);
    // Snap max to nearest multiple of 5 above max value, min 100
    const rawMax=Math.max(...vals);
    const maxV=Math.ceil(rawMax/5)*5;
    const nonZero=vals.filter(v=>v>0);
    const rawMin=nonZero.length?Math.min(...nonZero):0;
    const minV=Math.max(Math.floor(rawMin/5)*5-5,0);
    return`<div class="chart-wrap"><div class="chart-title">TLR Score Trend</div><div class="bar-chart">${months.map((m,i)=>{
      const v=vals[i];
      // Height based on range from minV to maxV for better visual spread
      const range=maxV-minV||1;
      const h=v>0?Math.max(8,Math.round(((v-minV)/range)*72)):2;
      return`<div class="bar-col"><div class="bar-val">${v||'-'}</div><div class="bar-fill" style="height:${h}px;background:${tlrColor(v)}"></div><div class="bar-lbl">${fmtM(m)}</div></div>`;
    }).join('')}</div></div>`;
  }
  document.getElementById('drillContent').innerHTML=`
    <button onclick="closeDrill()" style="position:absolute;top:16px;right:16px;background:var(--surface);border:none;border-radius:50%;width:32px;height:32px;font-size:18px;cursor:pointer;color:var(--muted);">x</button>
    <div class="drill-title">${ch}</div>
    <div class="drill-sub">${chObj?.day||''} - DC: ${dc?.name||'-'} - Target: ${chObj?.target||'-'} - Current: ${+lastE.membersClose||0}</div>
    <div class="sec-div">Monthly Net Add</div>
    <div class="month-grid">${months.map(m=>{const d=byM[m];return`<div class="month-card"><div class="month-lbl">${fmtM(m)}</div><div class="month-val" style="color:${d.net>0?'var(--green)':d.net<0?'var(--red)':'var(--text)'}">${d.net>0?'+':''}${d.net}</div><div class="month-sub">Up ${d.ind} Down ${d.drop}</div></div>`;}).join('')}</div>
    ${barChart('refs','var(--navy)','References per Month',false)}
    ${barChart('tyfcb','var(--purple)','TYFCB per Month',true)}
    ${tlrChart()}
    <div class="sec-div">Visitor Conversion by Month</div>
    <table style="width:100%;font-size:13px;border-collapse:collapse;">${months.map(m=>{const d=byM[m];const r=d.vis>0?Math.round((d.posVis/d.vis)*100):0;return`<tr style="border-bottom:1px solid var(--border)"><td style="padding:7px 0;">${fmtM(m)}</td><td>${d.vis} -> ${d.posVis} pos</td><td style="font-weight:700;color:${r>=30?'var(--green)':r>=15?'var(--amber)':'var(--red)'};text-align:right;">${r}%</td></tr>`;}).join('')}</table>
    <div class="sec-div">Weekly History</div>
    ${entries.slice().reverse().slice(0,10).map(e=>{const net=(+e.inductions||0)-(+e.drops||0);const conv=getEntryConv(e);
      return`<div class="entry-row"><div><strong>${fmtD(e.date)}</strong><span class="tm" style="margin-left:8px;">M:${e.membersClose} Net:${net>0?'+':''}${net} Conv:${conv}%</span></div><span class="pill ${tlrPillCls(+e.tlr)}">TLR ${e.tlr}</span></div>`;
    }).join('')}
    <div class="btn-row mt2">
      <button class="btn btn-navy btn-sm" onclick="S.callChapter='${ch}';closeDrill();switchTab('call')">Open in Call Mode -></button>
    </div>`;
  show('drillOverlay');document.getElementById('drillSheet').classList.add('open');
}

function setDefaultDate(){
  const ch=isSrdc()?document.getElementById('eChapter')?.value:S.dcActiveChapter||S.user?.chapter;
  const chObj=S.chapters.find(c=>c.name===ch);
  const dayName=chObj?.day||'Tuesday';
  const today=new Date();const targetDay=DAYS.indexOf(dayName);
  let diff=today.getDay()-targetDay;if(diff<0)diff+=7;
  const d=new Date(today);d.setDate(today.getDate()-diff);
  const el=document.getElementById('eDate');if(el)el.value=toLocalISODate(d);
}

function validateDate(){
  const ch=isSrdc()?document.getElementById('eChapter')?.value:S.dcActiveChapter||S.user?.chapter;
  const chObj=S.chapters.find(c=>c.name===ch);if(!chObj)return;
  const expDay=DAYS.indexOf(chObj.day);
  const dateEl=document.getElementById('eDate');if(!dateEl||!dateEl.value)return;
  const selDay=new Date(dateEl.value+'T00:00:00').getDay();
  const msg=document.getElementById('dateLockMsg');if(!msg)return;
  if(selDay!==expDay){msg.classList.remove('hidden');msg.textContent=`Warning: ${chObj.name} meets on ${chObj.day}s`;}
  else msg.classList.add('hidden');
}

function onChapterChange(){
  const ch=isSrdc()?document.getElementById('eChapter')?.value:S.dcActiveChapter||S.user?.chapter;
  if(!ch)return;
  if(!isSrdc()){const ec=document.getElementById('eChapter');if(ec){ec.value=ch;ec.disabled=true;}}
  setDefaultDate();buildVisDD(ch);
  const ms=document.getElementById('eMStart');
  const mc=document.getElementById('eMConn');
  // Use cascaded latest for correct member count
  const latestCascaded=getLatestCascaded(ch);
  // Auto-fill Connect from TLR report if available
  var _tlrRow=S.tlrData.find(function(r){return r.name.toLowerCase().includes(ch.toLowerCase())||ch.toLowerCase().includes(r.name.toLowerCase().replace('bni ',''));});
  var _tlrConnect=_tlrRow?Math.round(parseFloat(_tlrRow.chapterSize)||0):null;
  if(latestCascaded){
    if(ms){
      ms.value=latestCascaded.membersClose||0;
      if(isSrdc()){ms.readOnly=false;ms.style.background='var(--card)';ms.style.color='var(--text)';}
      else{ms.readOnly=true;ms.style.background='var(--surface)';ms.style.color='var(--muted)';}
    }
    if(mc)mc.value=_tlrConnect!==null?_tlrConnect:(latestCascaded.membersConnect||'');
  } else {
    if(ms){ms.value='';ms.readOnly=false;ms.style.background='var(--card)';ms.style.color='var(--text)';}
    if(mc)mc.value=_tlrConnect!==null?_tlrConnect:'';
  }
  recalcMembersClose();
  const rl_el=document.getElementById('recentLbl');if(rl_el)rl_el.textContent=ch;
  renderRecentEntries();
}

function calcActiveMembers(start,inductions,drops){
  return Math.max(0,(+start||0)+(+inductions||0)-(+drops||0));
}

function recalcMembersClose(){
  const ms=document.getElementById('eMStart');
  const ind=document.getElementById('eInd');
  const drop=document.getElementById('eDrop');
  const mc=document.getElementById('eMClose');
  if(!ms||!ind||!drop||!mc)return;
  const start=+ms.value||0;
  const inductions=+ind.value||0;
  const drops=+drop.value||0;
  mc.value=calcActiveMembers(start,inductions,drops);
}

// CASCADING MEMBER COUNT ───────────────────────────────────────
function getCascadedEntries(chapterName){
  var entries=S.weeklyData.filter(function(e){return e.chapter===chapterName;}).sort(function(a,b){return a.date.localeCompare(b.date);});
  if(!entries.length)return[];
  var runningClose=+entries[0].membersStart||+entries[0].membersClose||0;
  return entries.map(function(e,i){
    var start=i===0?(+e.membersStart||runningClose):runningClose;
    var ind=+e.inductions||0;
    var drop=+e.drops||0;
    var close=calcActiveMembers(start,ind,drop);
    runningClose=close;
    return Object.assign({},e,{membersStart:start,membersClose:close});
  });
}
function getCascadedForWeek(chapterName,tue,fri){
  return getCascadedEntries(chapterName).find(function(e){return e.date>=tue&&e.date<=fri;})||null;
}
function getLatestCascaded(chapterName){
  var all=getCascadedEntries(chapterName);
  return all.length?all[all.length-1]:null;
}

function getTLRFromReport(ch){const r=S.tlrData.find(x=>x.name.toLowerCase().includes(ch.toLowerCase())||ch.toLowerCase().includes(x.name.toLowerCase().replace('bni ','')));return r?+r.score||0:0;}
function getTLRConversion(ch){const r=S.tlrData.find(x=>x.name.toLowerCase().includes(ch.toLowerCase())||ch.toLowerCase().includes(x.name.toLowerCase().replace('bni ','')));if(!r||r.conversion===undefined||r.conversion===null||r.conversion==='')return null;var v=parseFloat(String(r.conversion).replace('%',''));return isNaN(v)?null:Math.round(v);}
function getEntryConv(e){
  if(!e)return 0;
  if(e.conversionPct!==undefined&&e.conversionPct!==null)return e.conversionPct;
  // Fallback for historical entries saved before conversionPct existed
  return(+e.visitors>0)?Math.round((+e.posVisitors||0)/(+e.visitors)*100):0;
}

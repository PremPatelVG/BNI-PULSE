function recalcQuickMembersClose(){
  const mc=document.getElementById('qu_mclose');
  if(!mc)return;
  const start=+mc.dataset.start||0;
  const inductions=+document.getElementById('qu_ind')?.value||0;
  const drops=+document.getElementById('qu_drop')?.value||0;
  mc.value=calcActiveMembers(start,inductions,drops);
}

async function quickSave(chapter,date){
  const btn=event.target;btn.disabled=true;btn.textContent='Saving...';
  try{
    const _ind=+document.getElementById('qu_ind')?.value||0;
    const _drop=+document.getElementById('qu_drop')?.value||0;
    const _mclose=document.getElementById('qu_mclose');
    const _start=+_mclose?.dataset.start||0;
    const _close=calcActiveMembers(_start,_ind,_drop);
    if(_mclose)_mclose.value=_close;
    const upd={inductions:_ind,drops:_drop,membersClose:_close,visitors:+document.getElementById('qu_vis')?.value||0,posVisitors:+document.getElementById('qu_pvis')?.value||0,eoi:+document.getElementById('qu_eoi')?.value||0,pipeline:+document.getElementById('qu_pipe')?.value||0,renewals:+document.getElementById('qu_ren')?.value||0,successStory:document.getElementById('qu_story')?.value||'',updatedAt:new Date().toISOString(),updatedBy:S.user.name};
    if(isLocalPreviewMode()){
      var idx=S.weeklyData.findIndex(function(e){return e.chapter===chapter&&e.date===date;});
      if(idx>=0)S.weeklyData[idx]=Object.assign({},S.weeklyData[idx],upd);
      else S.weeklyData.unshift(Object.assign({chapter:chapter,date:date,filledBy:S.user.name,filledByRole:S.user.role,savedAt:new Date().toISOString()},upd));
      saveLocalPreviewState();
      toast('Updated locally');
      renderCallContent();
    }else{
      await db.collection('weeklyData').doc(chapter+'_'+date).update(upd);
      logActivity('quick_update',{chapter:chapter,date:date});
      toast('Updated & synced');
    }
  }catch(e){toast('Failed: '+e.message);}
  btn.disabled=false;btn.textContent='Save Updates';
}

async function markAttendance(week,memberId,memberName,attended){
  try{
    await db.collection('attendance').doc(week).set({[memberId]:attended,[memberId+'_name']:memberName},{merge:true});
    logActivity('attendance_marked',{week:week,memberName:memberName,attended:attended});
    toast(attended?`${memberName} marked present`:`${memberName} marked absent`);
  }catch(e){
    toast('Could not save attendance: '+e.message,5000);
    if(S.tab==='call')renderCallMode();
  }
}

// RENEWALS ──
function renderRenewals(){
  const el=document.getElementById('tab-renewals');if(!el)return;
  const tlrLbl=S.tlrData.length?(S.tlrData[0]?.uploadedAt?'Uploaded '+fmtD(S.tlrData[0]?.uploadedAt):''):'';
  if(!S.duesData.length){el.innerHTML=`<div class="card"><div class="sec-hdr"><div class="sec-title">Upcoming Renewals</div></div><div class="empty">Upload a Membership Dues report first.<br><button class="btn btn-navy btn-sm mt2" onclick="switchTab('upload')">Upload</button></div></div>`;return;}
  const today=new Date(todayISO()+'T00:00:00');
  const windowDays=+S.renewalWindowDays||90;
  const rangeEnd=new Date(today);rangeEnd.setDate(rangeEnd.getDate()+windowDays);
  const visChaps=myChapters();
  const byChap={};S.duesData.forEach(m=>{if(!byChap[m.chapter])byChap[m.chapter]=[];byChap[m.chapter].push(m);});
  var totalShown=0,totalDone=0,totalPending=0,totalOverdue=0;
  let html='';
  visChaps.forEach(name=>{
    // Anything still outstanding stays listed no matter how long ago it lapsed.
    // Bounding the low end at the start of the current month silently dropped
    // renewals that were already overdue, which is exactly what must not be missed.
    const mems=(byChap[name]||[]).filter(m=>{
      const d=new Date(m.dueDate+'T00:00:00');
      if(d>rangeEnd)return false;
      return d>=today||!isRenewalDone(m);
    }).sort((a,b)=>new Date(a.dueDate)-new Date(b.dueDate));
    if(!mems.length)return;
    var chDone=mems.filter(isRenewalDone).length;
    totalShown+=mems.length;totalDone+=chDone;totalPending+=mems.length-chDone;
    html+=`<div class="ren-sec"><div class="ren-title">${name} <span class="tm">(${chDone}/${mems.length} complete)</span></div>
    ${mems.map(m=>{const due=new Date(m.dueDate+'T00:00:00'),days=Math.ceil((due-today)/86400000);
      const done=isRenewalDone(m);
      if(!done&&days<0)totalOverdue++;
      const cls=days<=14?'ur':days<=30?'ua':'ug';
      return`<div class="ren-item"><div><div style="font-size:13px;font-weight:600;">${esc(m.name)}</div><div class="tm">${esc(m.industry)} - Due: ${fmtD(m.dueDate)}</div></div>
      <div style="display:flex;align-items:center;gap:8px;">
        ${done?'<span class="ub ug" style="background:#dcfce7;color:#166534;">Complete</span>':'<span class="ub '+cls+'">'+(days<0?'OVERDUE':days===0?'TODAY':days+'d')+'</span>'}
        ${!isViewer()&&!done?`<button class="btn btn-green btn-sm" onclick="markRenewalDone('${jsArg(m.chapter)}','${encodeURIComponent(m.name)}','${jsArg(m.dueDate)}')">Mark Done</button>`:''}
      </div></div>`;
    }).join('')}</div>`;
  });
  var rangeBtn=function(days){
    return'<button class="btn btn-sm '+(windowDays===days?'btn-navy':'btn-secondary')+'" onclick="S.renewalWindowDays='+days+';renderRenewals()">'+days+' days</button>';
  };
  el.innerHTML=`<div class="card"><div class="sec-hdr"><div><div class="sec-title">Renewals</div><div class="tm">Outstanding renewals plus the next ${windowDays} days${tlrLbl?' - '+tlrLbl:''}</div></div><span class="tm" id="duesLbl">${totalDone}/${totalShown} complete</span></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;">
      ${rangeBtn(30)}${rangeBtn(60)}${rangeBtn(90)}
    </div>
    <div class="month-grid">
      <div class="month-card"><div class="month-lbl">Total Due</div><div class="month-val">${totalShown}</div></div>
      <div class="month-card"><div class="month-lbl">Complete</div><div class="month-val" style="color:var(--green);">${totalDone}</div></div>
      <div class="month-card"><div class="month-lbl">Pending</div><div class="month-val" style="color:var(--amber);">${totalPending}</div></div>
      <div class="month-card"><div class="month-lbl">Overdue</div><div class="month-val" style="color:var(--red);">${totalOverdue}</div></div>
    </div>
    ${html||`<div class="empty">No outstanding or upcoming renewals in the next ${windowDays} days.</div>`}</div>`;
}

async function setFeeCompliance(chapter,date,value){
  try{
    var localEntry=S.weeklyData.find(function(e){return e.chapter===chapter&&e.date===date;});
    if(isLocalPreviewMode()){
      if(localEntry)localEntry.feeComplianceOk=value;
      else S.weeklyData.unshift({chapter:chapter,date:date,feeComplianceOk:value,filledBy:S.user.name,filledByRole:S.user.role,savedAt:new Date().toISOString()});
      saveLocalPreviewState();
      toast('Compliance status saved locally');
    }else{
      await db.collection('weeklyData').doc(chapter+'_'+date).set({feeComplianceOk:value},{merge:true});
      if(localEntry)localEntry.feeComplianceOk=value;
      logActivity('fee_compliance_toggled',{chapter:chapter,date:date,value:value});
      toast('Compliance status saved');
    }
    renderCallContent();
  }catch(e){toast('Save failed: '+e.message);}
}

async function markRenewalDone(chapter,nameEnc,dueDate){
  const name=decodeURIComponent(nameEnc);
  const key=renewalDoneKey(chapter,name,dueDate);
  if(isLocalPreviewMode()){
    S.renewalsDone[key]={chapter,name,dueDate,markedBy:S.user.name,markedAt:new Date().toISOString()};
    saveLocalPreviewState();
    toast(`${name} renewal marked done locally`);
    renderRenewals();
    return;
  }
  try{
    await db.collection('renewalsDone').doc(key).set({chapter,name,dueDate,markedBy:S.user.name,markedAt:new Date().toISOString()});
    logActivity('renewal_marked_done',{chapter:chapter,name:name,dueDate:dueDate});
    toast(`${name} renewal marked done`);
    renderRenewals();
  }catch(e){
    // A failed write must never look like a successful one.
    toast('Could not mark renewal done: '+e.message,5000);
  }
}

    </div>
    <div class="report-filters" id="reportFilters"></div>
    <div id="reportContent"><div class="empty">Select a report above</div></div>
    <div id="reportExportRow" style="display:none;margin-top:8px;"><button class="btn btn-navy btn-sm" onclick="exportReport()">Export Report CSV</button></div>
  </div>`;
  renderReport();
}

function showExportBtn(){const r=document.getElementById('reportExportRow');if(r)r.style.display='flex';}
function hideExportBtn(){const r=document.getElementById('reportExportRow');if(r)r.style.display='none';}
function exportReport(){const tbl=document.querySelector('#reportContent table');if(!tbl){toast('No report to export');return;}const rows=[];tbl.querySelectorAll('tr').forEach(tr=>{const cells=[...tr.querySelectorAll('th,td')].map(td=>csvField(td.innerText));rows.push(cells.join(','));});const type=document.getElementById('reportType')?.value||'report';const labels={visit:'Chapter_Visit',attendance:'Call_Attendance',compliance:'Submission_Compliance',scorecard:'Chapter_Scorecard',funnel:'Induction_Funnel',synopsis:'Synopsis',renewal_risk:'Renewal_Risk',lost_visitors:'Lost_Positive_Visitors',miyagi_report:'Miyagi_1YRC_Report'};dl(rows.join('\n'),'BNI_'+(labels[type]||'Report')+'_'+todayISO()+'.csv','text/csv');toast('Report exported');}

function renderReport(){
  const typeEl=document.getElementById('reportType');if(!typeEl)return;
  hideExportBtn(); // the previous report's table is gone; its export button must go too
  const type=typeEl.value;
  var today=todayISO();
  var tma=new Date();tma.setMonth(tma.getMonth()-3);var tmaStr=toLocalISODate(tma);
  if(isLocalPreviewMode()&&S.ovWeek){
    var previewRange=getWeekTueFri(S.ovWeek);
    tmaStr=previewRange.tue;
    today=previewRange.fri;
  }
  const isSd=isSrdc()||isViewer();
  const chOpts=visibleChapters().map(c=>`<option value="${esc(c.name)}">${esc(c.name)}</option>`).join('');
  const chFilter=isSd?`<div class="fg"><label>Chapter</label><select id="rChap"><option value="">All Chapters</option>${chOpts}</select></div>`:'';
  const dateFilters=`<div class="fg"><label>From</label><input type="date" id="rFrom" value="${tmaStr}"></div><div class="fg"><label>To</label><input type="date" id="rTo" value="${today}"></div>`;
  const runBtn=(fn)=>`<div class="fg" style="justify-content:flex-end;align-self:flex-end;"><button class="btn btn-navy btn-sm" onclick="${fn}()">Run Report</button></div>`;
  const fEl=document.getElementById('reportFilters');const cEl=document.getElementById('reportContent');
  if(type==='visit'){fEl.innerHTML=dateFilters+chFilter+runBtn('runVisitReport');cEl.innerHTML='<div class="empty">Click Run Report</div>';}
  else if(type==='attendance'){fEl.innerHTML=dateFilters+runBtn('runAttendanceReport');cEl.innerHTML='<div class="empty">Click Run Report</div>';}
  else if(type==='compliance'){fEl.innerHTML=dateFilters+runBtn('runComplianceReport');cEl.innerHTML='<div class="empty">Click Run Report</div>';}
  else if(type==='scorecard'){fEl.innerHTML=dateFilters+runBtn('runScorecard');cEl.innerHTML='<div class="empty">Click Run Report</div>';}
  else if(type==='funnel'){fEl.innerHTML=dateFilters+runBtn('runFunnel');cEl.innerHTML='<div class="empty">Click Run Report</div>';}
  else if(type==='synopsis'){fEl.innerHTML=(isSd?`<div class="fg"><label>Chapter</label><select id="rChap">${chOpts}</select></div>`:'')+dateFilters+runBtn('runSynopsis');cEl.innerHTML='<div class="empty">Select chapter and click Run Report</div>';}
  else if(type==='renewal_risk'){fEl.innerHTML='';runRenewalRisk();}
  else if(type==='lost_visitors'){fEl.innerHTML=(isSd?`<div class="fg"><label>Chapter</label><select id="rChap"><option value="">All Chapters</option>${chOpts}</select></div>`:'')+runBtn('runLostVisitors');cEl.innerHTML='<div class="empty">Click Run Report</div>';}
  else if(type==='miyagi_report'){fEl.innerHTML=(isSd?`<div class="fg"><label>Chapter</label><select id="rChap"><option value="">All Chapters</option>${chOpts}</select></div>`:'')+runBtn('runMiyagiReport');cEl.innerHTML='<div class="empty">Click Run Report</div>';}
}

function gF(){const from=document.getElementById('rFrom')?.value||'';const to=document.getElementById('rTo')?.value||'';const chap=document.getElementById('rChap')?.value||'';return{from,to,chap};}
function fEntries(from,to,chapFilter){
  return S.weeklyData.filter(e=>{
    if(from&&e.date<from)return false;if(to&&e.date>to)return false;
    if(chapFilter&&e.chapter!==chapFilter)return false;
    // Applies to every scoped role, not just chapter directors. Senior Directors
    // previously fell through this check and saw the whole region.
    if(!isAreaDirector()&&!isViewer()&&!myChapters().includes(e.chapter))return false;
    return true;
  });
}

function runMiyagiReport(){
  var chap=document.getElementById('rChap')?.value||'';
  var visChaps=visibleChapterNames();
  var members=S.miyagiMembers.filter(function(m){
    if(!visChaps.includes(m.chapter))return false;
    if(chap&&m.chapter!==chap)return false;
    return true;
  }).sort(function(a,b){return(b.score||0)-(a.score||0);});

  if(!members.length){
    document.getElementById('reportContent').innerHTML='<div class="empty">No Miyagi members in this scope</div>';
    return;
  }

  showExportBtn();
  var h='<div style="overflow-x:auto;"><table class="rtbl"><thead><tr><th>Name</th><th>Chapter</th><th>Status</th><th>Belt</th><th>Score</th><th>Tasks Done</th><th>Check-ins Done</th><th>Check-ins Due</th><th>Last Activity</th></tr></thead><tbody>';
  members.forEach(function(m){
    var belt=getMiyagiBelt(m.score||0);
    var tasksDone=MIYAGI_TASKS.filter(function(t){return m.checkpoints&&m.checkpoints[t.key]&&m.checkpoints[t.key].done;}).length;
    var checkinsDone=Object.keys(m.checkins||{}).length;
    var checkinsDue=getMiyagiCheckinsDue(m);
    var activityLabel=m.status==='graduated'?'Yes Graduated':m.status==='dropped'?'No Dropped':isMiyagiStalled(m)?'Warning: Stalled':isMiyagiNeverStarted(m)?'Not Started Never Started':'🔵 Active';
    var statusLabel=activityLabel;
    h+='<tr>';
    h+='<td style="font-weight:700">'+esc(m.name)+'</td>';
    h+='<td>'+esc(m.chapter)+'</td>';
    h+='<td>'+statusLabel+'</td>';
    h+='<td><span style="color:'+belt.color+';font-weight:700;">'+esc(belt.name)+'</span></td>';
    h+='<td>'+(m.score||0)+'</td>';
    h+='<td>'+tasksDone+'/'+MIYAGI_TASKS.length+'</td>';
    h+='<td>'+checkinsDone+'/4</td>';
    h+='<td style="color:'+(checkinsDue.some(function(c){return c.overdue;})?'var(--red)':checkinsDue.length?'var(--amber)':'var(--muted)')+'">'+(checkinsDue.length||'-')+'</td>';
    h+='<td class="tm">'+(m.lastActivityDate?fmtD(m.lastActivityDate):'-')+'</td>';
    h+='</tr>';
  });
  h+='</tbody></table></div>';
  document.getElementById('reportContent').innerHTML=h;
}

function runLostVisitors(){
  var chap=document.getElementById('rChap')?.value||'';
  var visChaps=visibleChapterNames();
  var dropped=S.visitorPipeline.filter(function(p){
    if(p.stage!=='dropped')return false;
    if(!visChaps.includes(p.chapter))return false;
    if(chap&&p.chapter!==chap)return false;
    return true;
  }).sort(function(a,b){return(b.stageChangedDate||'').localeCompare(a.stageChangedDate||'');});

  if(!dropped.length){
    document.getElementById('reportContent').innerHTML='<div class="empty">No lost positive visitors in this scope - good news!</div>';
    return;
  }

  function daysBetween(d1,d2){if(!d1||!d2)return'-';var a=new Date(d1+'T00:00:00'),b=new Date(d2+'T00:00:00');return Math.max(0,Math.round((b-a)/86400000));}

  showExportBtn();
  document.getElementById('reportContent').innerHTML='<div style="overflow-x:auto;"><table class="rtbl"><thead><tr><th>Name</th><th>Category</th><th>Chapter</th><th>Added</th><th>Dropped</th><th>Days in Pipeline</th><th>Added By</th></tr></thead><tbody>'
    +dropped.map(function(p){
      return'<tr><td style="font-weight:700">'+esc(p.name)+'</td><td>'+(p.category||'-')+'</td><td>'+esc(p.chapter)+'</td><td>'+fmtD(p.addedDate)+'</td><td>'+fmtD(p.stageChangedDate)+'</td><td>'+daysBetween(p.addedDate,p.stageChangedDate)+'d</td><td class="tm">'+(p.filledBy||'-')+'</td></tr>';
    }).join('')
    +'</tbody></table></div>'
    +'<div style="margin-top:12px;padding:10px 14px;background:var(--surface);border-radius:8px;font-size:13px;"><strong>'+dropped.length+'</strong> positive visitors were lost in this scope - each one had expressed genuine interest (EOI-Yes) before dropping off.</div>';
}

function runVisitReport(){const{from,to,chap}=gF();const entries=fEntries(from,to,chap);const visits={};entries.forEach(e=>{(e.visitors_list||[]).forEach(name=>{const k=name+'||'+e.chapter;if(!visits[k])visits[k]={name,chapter:e.chapter,count:0,dates:[]};visits[k].count++;visits[k].dates.push(e.date);});});const rows=Object.values(visits).sort((a,b)=>b.count-a.count);if(!rows.length){document.getElementById('reportContent').innerHTML='<div class="empty">No visit data in this period</div>';return;}showExportBtn();document.getElementById('reportContent').innerHTML=`<div style="overflow-x:auto;"><table class="rtbl"><thead><tr><th>Visitor</th><th>Chapter</th><th>Visits</th><th>Dates</th></tr></thead><tbody>${rows.map(r=>`<tr><td style="font-weight:600">${esc(r.name)}</td><td>${esc(r.chapter)}</td><td><strong>${r.count}</strong></td><td class="tm">${r.dates.map(fmtD).join(', ')}</td></tr>`).join('')}</tbody></table></div>`;}

function runAttendanceReport(){
  const{from,to}=gF();
  const weeks=Object.keys(S.attendance).filter(w=>(!from||w>=from)&&(!to||w<=to)).sort();
  if(!weeks.length){document.getElementById('reportContent').innerHTML='<div class="empty">No attendance data yet. Mark attendance in Call Mode during your '+(S.srCallDay||'Friday')+' call.</div>';return;}
  const visChaps=myChapters();

}

function runComplianceReport(){

function runScorecard(){
  const{from,to}=gF();
  const entries=fScorecardEntries(from,to);
  const visChaps=visibleChapters();
  function scoreFmt(v){return v?String(Math.round(v*100)/100):'-';}
  const data=visChaps.map(function(ch){
    const chE=entries.filter(function(e){return e.chapter===ch.name;});
    const director=chapterDirectorName(ch);
    if(!chE.length)return{name:ch.name,director:director,weeks:0,netAdd:0,avgTLR:0,totRefs:0,totTYFCB:0,totVis:0,convRate:0};
    const netAdd=chE.reduce(function(s,e){return s+(+e.inductions||0)-(+e.drops||0);},0);
    const tlrE=chE.filter(function(e){return +e.tlr>0;});
    const avgTLR=tlrE.length?Math.round((tlrE.reduce(function(s,e){return s+(+e.tlr||0);},0)/tlrE.length)*100)/100:0;
    const totRefs=chE.reduce(function(s,e){return s+(+e.references||0);},0);
    const totTYFCB=chE.reduce(function(s,e){return s+(+e.tyfcb||0);},0);
    const totVis=chE.reduce(function(s,e){return s+(+e.visitors||0);},0);
    const convE=chE.filter(function(e){return e.conversionPct!==undefined&&e.conversionPct!==null;});
    const convRate=convE.length?Math.round(convE.reduce(function(s,e){return s+(+e.conversionPct||0);},0)/convE.length):0;
    return{name:ch.name,director:director,weeks:chE.length,netAdd:netAdd,avgTLR:avgTLR,totRefs:totRefs,totTYFCB:totTYFCB,totVis:totVis,convRate:convRate};
  }).sort(function(a,b){return(b.avgTLR-a.avgTLR)||(b.netAdd-a.netAdd)||a.name.localeCompare(b.name);});
  const totals=data.reduce(function(a,r){
    a.weeks+=r.weeks;a.netAdd+=r.netAdd;a.refs+=r.totRefs;a.tyfcb+=r.totTYFCB;a.vis+=r.totVis;
    if(r.avgTLR>0){a.tlrSum+=r.avgTLR;a.tlrCount++;}
    return a;
  },{weeks:0,netAdd:0,refs:0,tyfcb:0,vis:0,tlrSum:0,tlrCount:0});
  const regionTlr=totals.tlrCount?Math.round((totals.tlrSum/totals.tlrCount)*100)/100:0;
  showExportBtn();
  document.getElementById('reportContent').innerHTML=`<div style="overflow-x:auto;"><table class="rtbl"><thead><tr><th>Chapter</th><th>Director</th><th>Weeks</th><th>Net Add</th><th>Avg TLR</th><th>References</th><th>TYFCB</th><th>Visitors</th><th>Conv%</th></tr></thead><tbody>${data.map((r,i)=>`<tr><td style="font-weight:700">${i===0?'🥇 ':i===1?'🥈 ':i===2?'🥉 ':''}${esc(r.name)}</td><td>${esc(r.director)}</td><td>${r.weeks}</td><td style="color:${r.netAdd>=0?'var(--green)':'var(--red)'}"><strong>${r.netAdd>0?'+':''}${r.netAdd}</strong></td><td><span class="pill ${tlrPillCls(r.avgTLR)}">${scoreFmt(r.avgTLR)}</span></td><td>${r.totRefs}</td><td>Rs.${fmtL(r.totTYFCB)}</td><td>${r.totVis}</td><td style="color:${r.convRate>=30?'var(--green)':r.convRate>=15?'var(--amber)':'var(--red)'}">${r.convRate}%</td></tr>`).join('')}<tr style="font-weight:800;background:var(--surface);"><td>TOTAL / AVG</td><td>-</td><td>${totals.weeks}</td><td style="color:${totals.netAdd>=0?'var(--green)':'var(--red)'}">${totals.netAdd>0?'+':''}${totals.netAdd}</td><td><span class="pill ${tlrPillCls(regionTlr)}">${scoreFmt(regionTlr)}</span></td><td>${totals.refs}</td><td>Rs.${fmtL(totals.tyfcb)}</td><td>${totals.vis}</td><td>-</td></tr></tbody></table></div>`;
}

function runFunnel(){const{from,to}=gF();const entries=fEntries(from,to,'');const visChaps=visibleChapters();const data=visChaps.map(ch=>{const chE=entries.filter(e=>e.chapter===ch.name);if(!chE.length)return null;const tV=chE.reduce((s,e)=>s+(+e.visitors||0),0),tEY=chE.reduce((s,e)=>s+(+e.eoiYes||0),0),tEM=chE.reduce((s,e)=>s+(+e.eoiMaybe||0),0),tEN=chE.reduce((s,e)=>s+(+e.eoiNo||0),0),tI=chE.reduce((s,e)=>s+(+e.inductions||0),0);const pipelineContacts=S.visitorPipeline.filter(function(p){if(p.chapter!==ch.name)return false;var d=p.addedDate||p.stageChangedDate||'';if(from&&d&&d<from)return false;if(to&&d&&d>to)return false;return true;});const tP=pipelineContacts.filter(function(p){return(p.stage||'pipeline')==='pipeline';}).length;const tDropped=pipelineContacts.filter(function(p){return p.stage==='dropped';}).length;const overall=tV>0?Math.round(tI/tV*100):0;return{name:ch.name,tV,tEY,tEM,tEN,tP,tDropped,tI,r1:tV>0?Math.round(tEY/tV*100):0,overall};}).filter(Boolean);showExportBtn();document.getElementById('reportContent').innerHTML=`<div style="overflow-x:auto;"><table class="rtbl"><thead><tr><th>Chapter</th><th>Visitors</th><th>EOI Yes</th><th>EOI Maybe</th><th>EOI No</th><th>In Pipeline</th><th>Dropped</th><th>Inducted</th><th>Overall%</th></tr></thead><tbody>${data.map(r=>`<tr><td style="font-weight:700">${esc(r.name)}</td><td>${r.tV}</td><td>${r.tEY} <span class="tm">(${r.r1}%)</span></td><td>${r.tEM}</td><td>${r.tEN}</td><td style="color:var(--blue);">${r.tP}</td><td style="color:var(--red);">${r.tDropped}</td><td><strong>${r.tI}</strong></td><td style="color:${r.overall>=10?'var(--green)':r.overall>=5?'var(--amber)':'var(--red)'}"><strong>${r.overall}%</strong></td></tr>`).join('')}</tbody></table></div>`;}

  showExportBtn();

    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:9px;margin-bottom:14px;">

      <div class="month-card"><div class="month-lbl">References</div><div class="month-val">${totRefs}</div></div>
      <div class="month-card"><div class="month-lbl">TYFCB</div><div class="month-val">Rs.${fmtL(totTYFCB)}</div></div>

function runRenewalRisk(){
  const today=new Date(todayISO()+'T00:00:00');
  const plus30=new Date(today);plus30.setDate(today.getDate()+30);
  const plus60=new Date(today);plus60.setDate(today.getDate()+60);
  const visChaps=myChapters();
  const rows=visChaps.map(ch=>{
    const due30=(S.duesData||[]).filter(m=>{
      if(m.chapter!==ch)return false;
      const k=m.chapter+'_'+m.name+'_'+m.dueDate;if(S.renewalsDone[k])return false;
      const d=new Date(m.dueDate+'T00:00:00');return d>=today&&d<=plus30;
    });
    const due60=(S.duesData||[]).filter(m=>{
      if(m.chapter!==ch)return false;
      const k=m.chapter+'_'+m.name+'_'+m.dueDate;if(S.renewalsDone[k])return false;
      const d=new Date(m.dueDate+'T00:00:00');return d>plus30&&d<=plus60;
    });
    const allDue=[...due30,...due60];
    if(allDue.length===0)return null;
    const recentDrops=S.weeklyData.filter(e=>e.chapter===ch).slice(0,4).reduce((s,e)=>s+(+e.drops||0),0);
    let riskLevel='Low';
    if(due30.length>0&&recentDrops>0)riskLevel='High';
    else if(due30.length>0||recentDrops>0)riskLevel='Medium';
    return{ch,due30,due60,allDue,recentDrops,riskLevel};
  }).filter(Boolean).sort((a,b)=>['High','Medium','Low'].indexOf(a.riskLevel)-['High','Medium','Low'].indexOf(b.riskLevel));
  const fEl=document.getElementById('reportFilters');if(fEl)fEl.innerHTML='';
  if(!rows.length){document.getElementById('reportContent').innerHTML='<div class="empty">No upcoming renewals. Upload a membership dues report first.</div>';return;}
  document.getElementById('reportContent').innerHTML=rows.map(r=>`
    <div class="card" style="border-left:4px solid ${r.riskLevel==='High'?'var(--red)':r.riskLevel==='Medium'?'var(--amber)':'var(--green)'};">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;">
        <div><div style="font-size:16px;font-weight:800;">${r.ch}</div>
        <div class="tm">${r.due30.length} due in 30 days - ${r.due60.length} due in 31-60 days - ${r.recentDrops} recent drops</div></div>
        <span class="risk-badge ${r.riskLevel==='High'?'risk-h':r.riskLevel==='Medium'?'risk-m':'risk-l'}">${r.riskLevel} Risk</span>
      </div>
      ${r.due30.length>0?'<div style="font-size:11px;font-weight:700;color:var(--red);margin:4px 0 3px;">Due in 30 days:</div>'+r.due30.map(m=>'<div class="tm" style="padding:2px 0;">• '+esc(m.name)+' ('+esc(m.industry)+') - '+fmtD(m.dueDate)+'</div>').join(''):''}
      ${r.due60.length>0?'<div style="font-size:11px;font-weight:700;color:var(--amber);margin:6px 0 3px;">Due in 31-60 days:</div>'+r.due60.slice(0,4).map(m=>'<div class="tm" style="padding:2px 0;">• '+esc(m.name)+' ('+esc(m.industry)+') - '+fmtD(m.dueDate)+'</div>').join('')+(r.due60.length>4?'<div class="tm">...and '+(r.due60.length-4)+' more</div>':''):''}

function cleanCellValue(v){
  if(v===null||v===undefined)return'';
  if(v instanceof Date)return toIsoDate(v);
  if(typeof v==='object'){
    if(v.text!==undefined)return cleanCellValue(v.text);
    if(v.result!==undefined)return cleanCellValue(v.result);
    if(v.richText)return v.richText.map(function(x){return x.text||'';}).join('');
    if(v.hyperlink&&v.text)return cleanCellValue(v.text);
  }
  return String(v).replace(/\s+/g,' ').trim();
}

function normalizeHeader(v){
  return cleanCellValue(v).toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
}

function decodeXmlText(v){
  return String(v||'').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').trim();
}

function toIsoDate(v){
  if(!v)return'';
  if(v instanceof Date&&!isNaN(v.getTime())){
    return new Date(Date.UTC(v.getFullYear(),v.getMonth(),v.getDate())).toISOString().split('T')[0];
  }
  if(typeof v==='number'&&!isNaN(v)){
    var dNum=new Date(Math.round((v-25569)*86400*1000));
    return dNum.toISOString().split('T')[0];
  }
  var s=cleanCellValue(v);
  if(!s)return'';
  if(/^\d{4}-\d{2}-\d{2}/.test(s))return s.split('T')[0];
  var m=s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/);
  if(m){
    var yr=m[3].length===2?'20'+m[3]:m[3];
    return yr+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');
  }
  var months={jan:'01',feb:'02',mar:'03',apr:'04',may:'05',jun:'06',jul:'07',aug:'08',sep:'09',sept:'09',oct:'10',nov:'11',dec:'12'};
  m=s.toLowerCase().match(/^(\d{1,2})\s+([a-z]{3,9})\s+(\d{2,4})$/);
  if(m){
    var yr2=m[3].length===2?'20'+m[3]:m[3];
    var mon=months[m[2].slice(0,3)]||months[m[2]];
    if(mon)return yr2+'-'+mon+'-'+m[1].padStart(2,'0');
  }
  // Last resort. Non-ISO strings ("Aug 15 2026") are parsed as local midnight, so
  // read the calendar date back in local time rather than via UTC.
  var parsed=new Date(s);
  if(!isNaN(parsed.getTime()))return toLocalISODate(parsed);
  return s;
}

async function readExcelRows(file){
  if(!window.ExcelJS)throw new Error('Excel parser did not load');
  var buf=await file.arrayBuffer();
  var wb=new ExcelJS.Workbook();
  await wb.xlsx.load(buf);
  var ws=wb.worksheets[0];
  if(!ws)throw new Error('No worksheet found');
  var rows=[];
  var colCount=ws.actualColumnCount||ws.columnCount||20;
  ws.eachRow({includeEmpty:false},function(row){
    var cells=[];
    for(var i=1;i<=colCount;i++)cells.push(cleanCellValue(row.getCell(i).value));
    rows.push(cells);
  });
  return rows;
}

function readTextFile(file){
  return new Promise(function(resolve,reject){
    var r=new FileReader();
    r.onload=function(e){resolve(e.target.result||'');};
    r.onerror=function(){reject(r.error||new Error('Could not read file'));};
    r.readAsText(file);
  });
}

async function readPdfText(file){
  var pdfjs=window.pdfjsLib;
  if(!pdfjs){
    pdfjs=await import('/vendor/pdf.min.mjs');
    pdfjs.GlobalWorkerOptions.workerSrc='/vendor/pdf.worker.min.mjs';
    window.pdfjsLib=pdfjs;
  }
  var data=new Uint8Array(await file.arrayBuffer());
  var pdf=await pdfjs.getDocument({data:data}).promise;
  var lines=[];
  for(var p=1;p<=pdf.numPages;p++){
    var page=await pdf.getPage(p);
    var text=await page.getTextContent();
    var items=text.items.map(function(it){
      return{x:it.transform[4],y:Math.round(it.transform[5]),str:it.str};
    }).filter(function(it){return it.str&&it.str.trim();});
    items.sort(function(a,b){return b.y-a.y||a.x-b.x;});
    var groups=[];
    items.forEach(function(it){
      var g=groups.find(function(row){return Math.abs(row.y-it.y)<=3;});
      if(!g){g={y:it.y,items:[]};groups.push(g);}
      g.items.push(it);
    });
    groups.sort(function(a,b){return b.y-a.y;}).forEach(function(g){
      g.items.sort(function(a,b){return a.x-b.x;});
      lines.push(g.items.map(function(it){return it.str.trim();}).join(' ').replace(/\s+/g,' ').trim());
    });
  }
  return lines.join('\n');
}

function findHeaderRow(rows,words){
  for(var i=0;i<Math.min(rows.length,40);i++){
    var hs=rows[i].map(normalizeHeader);
    var matches=words.filter(function(w){return hs.some(function(h){return h.indexOf(w)>=0;});}).length;
    if(matches>=Math.min(2,words.length))return i;
  }
  return -1;
}

function colIndex(headers,candidates){
  var hs=headers.map(normalizeHeader);
  for(var c=0;c<candidates.length;c++){
    var needle=normalizeHeader(candidates[c]);
    var idx=hs.findIndex(function(h){return h===needle||h.indexOf(needle)>=0||needle.indexOf(h)>=0&&h.length>2;});
    if(idx>=0)return idx;
  }
  return -1;
}

function cellAt(row,idx){return idx>=0?cleanCellValue(row[idx]):'';}

function matchChapterName(raw){
  var s=cleanCellValue(raw).split('>').pop().replace(/^BNI\s+/i,'').trim();
  var lc=s.toLowerCase();
  var found=reportChapterNames().find(function(ch){
    var c=ch.toLowerCase();
    return lc===c||lc.indexOf(c)>=0||c.indexOf(lc)>=0;
  });
  return found||s;
}

function cleanMemberNameForChapter(name,chapter){
  var s=cleanCellValue(name);
  if(!s)return'';
  if(chapter){
    var ch=chapter.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    s=s.replace(new RegExp('[_\\-\\s]+BNI\\s*'+ch+'$','i'),'');
    s=s.replace(new RegExp('[_\\-\\s]+'+ch+'$','i'),'');
  }
  return s.replace(/\s+/g,' ').trim();
}

function filterRowsToScope(rows){
  var scope=uploadScopeChapters();
  return rows.filter(function(m){
    return scope.some(function(ch){
      var a=(m.chapter||'').toLowerCase(),b=ch.toLowerCase();
      return a===b||a.indexOf(b)>=0||b.indexOf(a)>=0;
    });
  }).map(function(m){
    var match=scope.find(function(ch){
      var a=(m.chapter||'').toLowerCase(),b=ch.toLowerCase();
      return a===b||a.indexOf(b)>=0||b.indexOf(a)>=0;
    });
    if(match)m.chapter=match;
    return m;
  });
}

function sameChapterName(a,b){
  a=(a||'').toLowerCase();b=(b||'').toLowerCase();
  return a===b||a.indexOf(b)>=0||b.indexOf(a)>=0;
}

function dueMemberKey(m){
  return[(m.chapter||'').toLowerCase(),(m.name||'').toLowerCase().replace(/\s+/g,' ').trim(),m.dueDate||''].join('|');
}

function renewalDoneKey(chapter,name,dueDate){
  return((chapter||'')+'_'+(name||'')+'_'+(dueDate||'')).replace(/\s+/g,'_').replace(/[^a-zA-Z0-9_-]/g,'_');
}

function isRenewalDone(m){
  if(!m)return false;
  return !!S.renewalsDone[renewalDoneKey(m.chapter,m.name,m.dueDate)]||!!S.renewalsDone[m.chapter+'_'+m.name+'_'+m.dueDate];
}

function uniqueDuesMembers(rows){
  var seen={};
  return(rows||[]).filter(function(m){
    var key=dueMemberKey(m);
    if(seen[key])return false;
    seen[key]=true;
    return true;
  });
}

function fScorecardEntries(from,to){
  var byWeek={};
  visibleChapterNames().forEach(function(ch){
    getCascadedEntries(ch).forEach(function(e){
      if(from&&e.date<from)return;
      if(to&&e.date>to)return;
      var key=e.chapter+'_'+getWeekKey(e.date);
      if(!byWeek[key]||e.date>byWeek[key].date)byWeek[key]=e;

  return Object.values(byWeek);
}

function mergeDuesUpload(existing,incoming){
  incoming=uniqueDuesMembers(incoming||[]);
  var uploadedChapters=[...new Set(incoming.map(function(m){return m.chapter;}).filter(Boolean))];
  var preserved=(existing||[]).filter(function(m){
    return !uploadedChapters.some(function(ch){return sameChapterName(m.chapter,ch);});
  });
  return uniqueDuesMembers(preserved.concat(incoming));
}

function parseDuesRows(rows){
  var members=[];
  var hi=findHeaderRow(rows,['chapter','name','due']);
  if(hi>=0){
    var h=rows[hi];
    var iChapter=colIndex(h,['Chapter Name','Chapter']);
    var iFirst=colIndex(h,['First Name','First']);
    var iLast=colIndex(h,['Last Name','Last']);
    var iName=colIndex(h,['Full Name','Member Name','Member','Name']);
    var iIndustry=colIndex(h,['Industry','Classification','Category','Profession','Company','Business']);
    var iType=colIndex(h,['Membership Type','Member Type','Type']);
    var iStatus=colIndex(h,['Status']);
    var iDue=colIndex(h,['Renewal Due','Due Date','Renewal Date','Expiry Date','Paid Through','Membership Due']);
    rows.slice(hi+1).forEach(function(row){
      var chapter=matchChapterName(cellAt(row,iChapter));
      var name=iName>=0?cellAt(row,iName):(cellAt(row,iFirst)+' '+cellAt(row,iLast)).trim();
      var status=cellAt(row,iStatus)||'Active';
      var dueDate=toIsoDate(cellAt(row,iDue));
      if(chapter&&name&&dueDate&&(iStatus<0||/active/i.test(status))){
        members.push({chapter:chapter,name:name,industry:cellAt(row,iIndustry),type:cellAt(row,iType),status:status,dueDate:dueDate});
      }
    });
    return members;
  }
  rows.forEach(function(cells){
    if(cells[0]&&cells[0].indexOf('>')>=0&&cells[5]==='Active'&&cells[6]){
      members.push({chapter:matchChapterName(cells[0]),name:(cells[1]+' '+cells[2]).trim(),industry:cells[3],type:cells[4],status:cells[5],dueDate:toIsoDate(cells[6])});
    }
  });
  return members;
}

function readXmlSpreadsheetRows(text){
  try{
    var doc=new DOMParser().parseFromString(text,'text/xml');
    var rows=[].slice.call(doc.getElementsByTagNameNS('urn:schemas-microsoft-com:office:spreadsheet','Row'));
    if(!rows.length)rows=[].slice.call(doc.getElementsByTagName('Row'));
    return rows.map(function(row){
      var out=[];var col=1;
      var cells=[].slice.call(row.getElementsByTagNameNS('urn:schemas-microsoft-com:office:spreadsheet','Cell'));
      if(!cells.length)cells=[].slice.call(row.getElementsByTagName('Cell'));
      cells.forEach(function(cell){
        var idx=+(cell.getAttribute('ss:Index')||cell.getAttributeNS('urn:schemas-microsoft-com:office:spreadsheet','Index')||0);
        if(idx){while(col<idx){out.push('');col++;}}
        var data=cell.getElementsByTagNameNS('urn:schemas-microsoft-com:office:spreadsheet','Data')[0]||cell.getElementsByTagName('Data')[0];
        out.push(cleanCellValue(data?data.textContent:''));
        col++;
      });
      return out;
    }).filter(function(r){return r.some(Boolean);});
  }catch(e){return[];}
}

function parseDuesLegacy(text){
  var xmlRows=readXmlSpreadsheetRows(text);
  if(xmlRows.length){
    var parsed=parseDuesRows(xmlRows);
    if(parsed.length)return parsed;
  }
  const rows=text.match(/<(?:ss:)?Row[^>]*>[\s\S]*?<\/(?:ss:)?Row>/g)||[];const members=[];
  rows.forEach(row=>{
    const cells=[...row.matchAll(/<(?:ss:)?Data[^>]*>([^<]*)<\/(?:ss:)?Data>/g)].map(m=>decodeXmlText(m[1]));
    if(!cells.length)return;
    if(cells[0]&&cells[0].includes('>')&&cells[5]==='Active'&&cells[6]){
      const name=(cells[1]+' '+cells[2]).trim();
      members.push({chapter:matchChapterName(cells[0]),name,industry:cells[3],type:cells[4],status:cells[5],dueDate:toIsoDate(cells[6])});
    }
  });return members;
}

function numericTokens(line){
  return(String(line||'').match(/[-+]?\d[\d,]*(?:\.\d+)?%?/g)||[]).map(function(v){return v.replace(/,/g,'').replace('%','');});
}

function percentForRow(lines,label){
  var l=lines.find(function(x){return new RegExp('^'+label+'\\b','i').test(x);});
  if(!l)return'';
  var nums=numericTokens(l);
  return nums.length?nums[nums.length-1]:'';
}

function firstMatch(lines,re,group){
  for(var i=0;i<lines.length;i++){
    var m=lines[i].match(re);
    if(m)return m[group||1];
  }
  return'';
}

function firstTwoNumberRow(lines,re){
  var l=lines.find(function(x){return re.test(x);})||'';
  var m=l.match(re);
  return m?[m[1].replace(/,/g,''),m[2].replace(/,/g,'')]:['',''];
}

function metricAfterDash(lines,re){
  var l=lines.find(function(x){return re.test(x);})||'';
  var m=l.match(re);
  return m?m[1].replace(/,/g,''):'';
}

function parseMoney(v){
  var cleaned=String(v||'').replace(/[^\d.]/g,'');
  if(!cleaned)return'';
  return String(Math.round(parseFloat(cleaned)||0));
}

function moneyTokens(line){
  var rupees=[...String(line||'').matchAll(/₹\s*([\d,]+(?:\.\d+)?)/g)].map(function(m){return parseMoney(m[1]);});
  if(rupees.length)return rupees;
  return(String(line||'').match(/[\d,]+(?:\.\d+)?/g)||[]).map(function(v){return parseMoney(v);});
}

function chapterBusinessPassed(lines){
  var l=lines.find(function(x){return /^Business Passed\b/i.test(x)&&/Avg Referral Value/i.test(x);})||'';
  var vals=moneyTokens(l);
  return{lastMonthBusinessPassed:vals[0]||'',sixMonthBusinessPassed:vals[1]||''};
}

function averageBusinessPassed(lines){
  var l=lines.find(function(x){return /^Avg Business Passed\b/i.test(x);})||'';
  return moneyTokens(l)[0]||'';
}

function countMemberTrafficPages(lines,chapter,region){
  var seen={};
  for(var i=1;i<lines.length;i++){
    if(!/Absent\s+Referral/i.test(lines[i]))continue;
    var prev=lines[i-1]||'';
    if(/^Chapter\b/i.test(prev)||!prev.trim())continue;
    var name=prev;
    if(chapter)name=name.replace(new RegExp('\\b'+chapter.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b','ig'),'');
    if(region)name=name.replace(new RegExp('\\b'+region.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b','ig'),'');
    name=name.replace(/\bBNI\b/ig,'').replace(/\s+/g,' ').trim();
    if(name&&name.length>1)seen[name.toLowerCase()]=true;
  }
  return Object.keys(seen).length;
}

function countCurrentMonthScoredMembers(lines,reportMonth){
  if(!reportMonth)return 0;
  var escaped=reportMonth.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  var re=new RegExp('^'+escaped+'\\s+(?:[-+]?\\d+(?:\\.\\d+)?\\s+){7}[-+]?\\d+(?:\\.\\d+)?$','i');
  return lines.filter(function(l){return re.test(l);}).length;
}

function inferStatusTotal(vals){
  var nums=vals.map(function(v){return parseFloat(v);}).filter(function(v){return!isNaN(v);});
  if(nums.length!==4)return 0;
  var best={total:0,error:Infinity};
  for(var total=1;total<=300;total++){
    var counts=nums.map(function(pct){return Math.round((pct/100)*total);});
    if(counts.reduce(function(s,c){return s+c;},0)!==total)continue;
    var err=nums.reduce(function(s,pct,i){return s+Math.abs(pct-(counts[i]/total)*100);},0);
    if(err<best.error)best={total:total,error:err};
  }
  return best.error<=0.08?best.total:0;
}

function parseChapterTrafficLightPdf(lines,sourceFile){
  var reportMonth=firstMatch(lines,/Report Issue Date\s+([A-Za-z]{3}-\d{4})/i,1)||firstMatch(lines,/Period\s+([A-Za-z]{3}-\d{4})/i,1);
  var region=firstMatch(lines,/^Region\s+(.+)$/i,1);
  var rawChapter=firstMatch(lines,/^Chapter\s+(?!Report\b|Meeting Day\b)(.+)$/i,1);
  if(!rawChapter)return null;
  var chapter=matchChapterName(rawChapter);
  var scoreLine=lines.find(function(l){return /Member Name\s+Total\s+Average Per Month/i.test(l);})||'';
  var scoreNums=numericTokens(scoreLine);
  var score=scoreNums.length?scoreNums[scoreNums.length-1]:'';
  if(!score)return null;

  var refNums=firstTwoNumberRow(lines,/^Total Referrals\s+([\d,]+)\s+([\d,]+)\b/i);
  var lastMonthReferrals=refNums[0];
  var sixMonthReferrals=refNums[1];
  var avgRefs=metricAfterDash(lines,/^Avg No\.?\s*of Referrals\s+-?\s*([\d,]+)/i);
  var visitorNums=firstTwoNumberRow(lines,/^No\.?\s*of Visitors\s+([\d,]+)\s+([\d,]+)\b/i);
  var lastMonthVisitors=visitorNums[0];
  var sixMonthVisitors=visitorNums[1];
  var avgVisitors=metricAfterDash(lines,/^Avg No\.?\s*of Visitors\s+-?\s*([\d,]+)/i);
  var businessPassed=chapterBusinessPassed(lines);
  var avgBusinessPassed=averageBusinessPassed(lines);
  var greenPct=percentForRow(lines,'GREEN');
  var amberPct=percentForRow(lines,'AMBER');
  var redPct=percentForRow(lines,'RED');
  var greyPct=percentForRow(lines,'GREY');
  var scoredMembers=countCurrentMonthScoredMembers(lines,reportMonth);
  var statusTotal=inferStatusTotal([greenPct,amberPct,redPct,greyPct]);
  var memberDetailPages=countMemberTrafficPages(lines,chapter,region);
  var chapterSize=scoredMembers||statusTotal||memberDetailPages;

  return{
    name:chapter,
    score:score,
    chapterSize:chapterSize||'',
    memberGrowth:'',
    retention:'',
    referrals:avgRefs||lastMonthReferrals||'',
    visitors:avgVisitors||lastMonthVisitors||'',
    conversion:'',
    absenteeism:'',
    reportMonth:reportMonth,
    region:region,
    pdfFormat:'chapter_member_tlr',
    sourceFile:sourceFile||'',
    lastMonthReferrals:lastMonthReferrals,
    sixMonthReferrals:sixMonthReferrals,
    avgReferrals:avgRefs,
    tyfcb:businessPassed.lastMonthBusinessPassed,
    lastMonthBusinessPassed:businessPassed.lastMonthBusinessPassed,
    sixMonthBusinessPassed:businessPassed.sixMonthBusinessPassed,
    avgBusinessPassed:avgBusinessPassed,
    lastMonthVisitors:lastMonthVisitors,
    sixMonthVisitors:sixMonthVisitors,
    avgVisitors:avgVisitors,
    greenPct:greenPct,
    amberPct:amberPct,
    redPct:redPct,
    greyPct:greyPct,
    scoredMembers:scoredMembers,
    memberDetailPages:memberDetailPages
  };
}

function parseTLRText(text,sourceFile){
  var lines=String(text||'').split(/\r?\n/).map(function(l){return l.replace(/\s+/g,' ').trim();}).filter(Boolean);
  var chapterPdf=parseChapterTrafficLightPdf(lines,sourceFile);
  if(chapterPdf)return[chapterPdf];

  var chapters=reportChapterNames().sort(function(a,b){return b.length-a.length;});
  var results=[];
  for(var i=0;i<lines.length;i++){
    var line=lines[i];
    var chapter=chapters.find(function(ch){return line.toLowerCase().indexOf(ch.toLowerCase())>=0;});
    if(!chapter)continue;
    var combined=line;
    var nums=(combined.match(/[-+]?\d+(?:\.\d+)?%?/g)||[]);
    for(var j=1;j<=2&&nums.length<8&&lines[i+j];j++){
      combined+=' '+lines[i+j];
      nums=(combined.match(/[-+]?\d+(?:\.\d+)?%?/g)||[]);
    }
    nums=nums.map(function(n){return n.replace('%','');}).filter(function(n){return n!=='';});
    if(nums.length<8)continue;
    nums=nums.slice(-8);
    if(results.some(function(r){return r.name===chapter;}))continue;
    results.push({name:chapter,chapterSize:nums[0],memberGrowth:nums[1],retention:nums[2],referrals:nums[3],visitors:nums[4],conversion:nums[5],absenteeism:nums[6],score:nums[7]});
  }
  return results;
}

async function importHistorical(){
  const btn=document.getElementById('importBtn');const st=document.getElementById('importStatus');
  btn.disabled=true;btn.textContent='Importing...';
  const existing=new Set(S.weeklyData.map(e=>e.chapter+'_'+e.date));
  const toImport=HIST.filter(r=>!existing.has(r.chapter+'_'+r.date));
  st.textContent=`Found ${toImport.length} new entries...`;let done=0;
  for(let i=0;i<toImport.length;i+=20){
    const batch=db.batch();
    toImport.slice(i,i+20).forEach(r=>{batch.set(db.collection('weeklyData').doc(r.chapter+'_'+r.date),r);done++;});
    await batch.commit();st.textContent=`Importing... ${Math.min(i+20,toImport.length)}/${toImport.length}`;
  }
  st.textContent=`Yes ${done} imported. ${HIST.length-toImport.length} already existed.`;
  toast(`Yes ${done} historical entries imported`);
  btn.disabled=false;btn.textContent='⬆ Import Historical Data';
}

function memberSeniorDirectorSummary(memberData){
  var role=memberData.role;
  var chapters=(memberData.chapters&&memberData.chapters.length)?memberData.chapters:(memberData.chapter?[memberData.chapter]:[]);
  if(role==='ad')return'Whole region access';
  if(role==='srdc')return memberData.name+' is the Senior DC for '+(chapters.length?chapters.join(', '):'assigned chapters');
  var mapped=chapters.map(function(chName){
    var mappedSenior=(memberData.chapterReportsTo&&memberData.chapterReportsTo[chName])||'';
    var chapter=S.chapters.find(function(c){return c.name===chName;});
    var senior=mappedSenior||(chapter&&chapter.seniorDirector)||memberData.reportsTo||'Not assigned';
    return chName+' -> '+senior;
  });
  if(mapped.length)return mapped.join('; ');
  return memberData.reportsTo||'Not assigned';
}

async function saveMember(){
  const id=document.getElementById('editMemberId').value;
  const name=document.getElementById('mName').value.trim();
  const pin=document.getElementById('mPin').value.trim();
  const role=document.getElementById('mRole').value;
  const reportsTo=document.getElementById('mReportsTo')?.value.trim()||'';
  if(!name){toast('Name required');return;}if(!id&&(!pin||pin.length<4)){toast('PIN must be 4+ digits');return;}
  let chapters=[],chapter='';
  if(role==='viewer'||role==='ad'){chapters=[];chapter='';}
  else if(role==='dc'||role==='srdc'){const sel=document.getElementById('mChapters');chapters=sel?Array.from(sel.selectedOptions).map(o=>o.value):[];chapter=chapters[0]||'';}
  else{chapter=document.getElementById('mChapter')?.value||'';chapters=[chapter];}
  const existing=id?S.members.find(function(x){return x.id===id;}):null;
  const chapterReportsTo={};
  chapters.forEach(function(chName){
    const chObj=S.chapters.find(function(c){return c.name===chName;});
    if(chObj&&chObj.seniorDirector)chapterReportsTo[chName]=chObj.seniorDirector;
  });
  const reportTargets=[...new Set(Object.values(chapterReportsTo).filter(Boolean))];
  const finalReportsTo=reportsTo||reportTargets.join('; ');
  const data={name,role,chapter,chapters,reportsTo:finalReportsTo};
  if(Object.keys(chapterReportsTo).length)data.chapterReportsTo=chapterReportsTo;
  else if(existing&&existing.chapterReportsTo)data.chapterReportsTo=existing.chapterReportsTo;
  // The PIN is sent once, over the wire, for the server to bcrypt. It is never
  // written to Firestore in the clear and never stored in browser state.
  if(pin)data.pin=pin;
  try{
    await apiFetch('/members',{method:'POST',body:Object.assign({id:id||undefined},data)});
  }catch(e){toast('Could not save member: '+e.message,5000);return;}
  await refreshSnapshot();
  clearMemberForm();
  hide('memberFormCard');
  if(pin)showMemberPasswordConfirmation(data,pin,!id);
  else toast('Saved');
}

// SORTABLE TABLES (app-wide) ──────────────────────────
function makeSortable(){
  document.querySelectorAll('table.rtbl').forEach(function(tbl){
    if(tbl.dataset.sortable==='1')return; // already wired
    tbl.dataset.sortable='1';
    var thead=tbl.querySelector('thead');
    if(!thead)return;
    var headerRows=thead.querySelectorAll('tr');
    var lastRow=headerRows[headerRows.length-1];
    if(!lastRow)return;
    var ths=lastRow.querySelectorAll('th');
    ths.forEach(function(th,colIdx){
      th.style.cursor='pointer';
      th.style.userSelect='none';
      th.addEventListener('click',function(){
        sortTableByColumn(tbl,colIdx);
      });
    });
  });
}

function sortTableByColumn(tbl,colIdx){
  var tbody=tbl.querySelector('tbody');
  if(!tbody)return;
  var rows=Array.prototype.slice.call(tbody.querySelectorAll('tr'));
  if(!rows.length)return;
  // Skip a TOTAL row if present at the end - keep it pinned to bottom
  var totalRow=null;
  var lastRow=rows[rows.length-1];
  if(lastRow && /TOTAL/i.test(lastRow.textContent)){
    totalRow=rows.pop();
  }
  var curDir=tbl.dataset.sortCol===String(colIdx)?tbl.dataset.sortDir:null;
  var newDir=curDir==='asc'?'desc':'asc';
  tbl.dataset.sortCol=String(colIdx);
  tbl.dataset.sortDir=newDir;
  function cellText(row){
    var cells=row.querySelectorAll('td');
    if(colIdx>=cells.length)return'';
    return cells[colIdx].textContent.trim();
  }
  function parseVal(txt){
    var clean=txt.replace(/[^0-9.\-+]/g,'');
    var num=parseFloat(clean);
    if(!isNaN(num)&&clean!==''&&clean!=='-'&&clean!=='+')return num;
    return txt.toLowerCase();
  }
  rows.sort(function(a,b){
    var va=parseVal(cellText(a));
    var vb=parseVal(cellText(b));
    var cmp;
    if(typeof va==='number'&&typeof vb==='number')cmp=va-vb;
    else cmp=String(va).localeCompare(String(vb));
    return newDir==='asc'?cmp:-cmp;
  });
  rows.forEach(function(r){tbody.appendChild(r);});
  if(totalRow)tbody.appendChild(totalRow);
  // Update header arrow indicators
  var thead=tbl.querySelector('thead');
  var headerRows=thead.querySelectorAll('tr');
  var lastHeaderRow=headerRows[headerRows.length-1];
  var ths=lastHeaderRow.querySelectorAll('th');
  ths.forEach(function(th,i){
    var base=th.textContent.replace(/[\s]*[UpDown][\s]*$/,'').trim();
    if(i===colIdx){th.textContent=base+(newDir==='asc'?' Up':' Down');}
    else{th.textContent=base;}
  });
}

// HEALTH SCORE ─────────────────────────────────────────
function calcHealthScore(chapterName){
  var weeks=getWeeks(); var recent4=weeks.slice(0,4);
  if(!recent4.length)return null;

  // Compliance - 15 pts, submission rate over last 4 weeks
  var submitted=recent4.filter(function(wk){var r=getWeekTueFri(wk);return S.weeklyData.some(function(e){return e.chapter===chapterName&&e.date>=r.tue&&e.date<=r.fri;});}).length;
  var complianceScore=Math.round((submitted/4)*15);

  // Net Add - 20 pts, pass/fail: inductions or positive net add in each of the last 3 calendar months
  var todayForMonths=new Date();
  var last3Months=[];
  for(var mi=0;mi<3;mi++){var d=new Date(todayForMonths);d.setMonth(d.getMonth()-mi);last3Months.push(d.toISOString().substring(0,7));}
  var monthsPassed=last3Months.filter(function(mo){
    var moEntries=getCascadedEntries(chapterName).filter(function(e){return e.date.startsWith(mo);});
    if(!moEntries.length)return false;
    var moNet=(+moEntries[moEntries.length-1].membersClose||0)-(+moEntries[0].membersStart||0);
    var moInd=moEntries.reduce(function(s,e){return s+(+e.inductions||0);},0);
    return moNet>0||moInd>0;
  }).length;
  var netScore=monthsPassed===3?20:0;

  // TLR - 20 pts, pass/fail: Amber or Green (TLR >= 50)
  var tlrRow=S.tlrData.find(function(r){return r.name.toLowerCase().includes(chapterName.toLowerCase())||chapterName.toLowerCase().includes(r.name.toLowerCase().replace('bni ',''));});
  var tlr=tlrRow?+tlrRow.score:0;
  var tlrScore=tlr>=50?20:0;

  // Conversion - 20 pts, TLR-sourced conversion rate (tiered)
  var entries=getCascadedEntries(chapterName).reverse().slice(0,4);
  var convRates=entries.map(function(e){return getEntryConv(e);});
  var avgConv=convRates.length?convRates.reduce(function(a,b){return a+b;},0)/convRates.length:0;
  var hasVisitorsNoConv=entries.some(function(e){return(+e.visitors||0)>0;})&&avgConv<15;
  var convScore=avgConv>=50?20:avgConv>=30?14:avgConv>=15?8:0;

  // EOI Follow-through - 25 pts, based on pending EOI backlog
  var eoiPendingTotal=entries.reduce(function(s,e){
    var p=(+e.visitors||0)-((+e.eoiYes||0)+(+e.eoiMaybe||0)+(+e.eoiNo||0));
    return s+Math.max(0,p);
  },0);
  var eoiScore=eoiPendingTotal===0?25:eoiPendingTotal<=2?18:eoiPendingTotal<=5?10:0;

  var total=complianceScore+netScore+tlrScore+convScore+eoiScore;
  var grade=total>=80?'A':total>=60?'B':total>=40?'C':'D';
  return{total:total,grade:grade,complianceScore:complianceScore,netScore:netScore,tlrScore:tlrScore,convScore:convScore,eoiScore:eoiScore,poorConversionFlag:hasVisitorsNoConv};
}

// ACTION ITEMS ─────────────────────────────────────────
function getActionItems(chapterName){
  var items=[];
  var weeks=getWeeks(); var recent4=weeks.slice(0,4);
  var entries=getCascadedEntries(chapterName).reverse();
  var curr=entries[0];
  var missed=recent4.filter(function(wk){var r=getWeekTueFri(wk);return !S.weeklyData.some(function(e){return e.chapter===chapterName&&e.date>=r.tue&&e.date<=r.fri;});}).length;
  if(missed>=2)items.push({type:'warning',msg:'Missed '+missed+' of last 4 weekly submissions'});
  var recentNets=entries.slice(0,4).map(function(e){return(+e.inductions||0)-(+e.drops||0);});
  if(recentNets.length>=3&&recentNets.slice(0,3).every(function(n){return n<=0;}))items.push({type:'danger',msg:'Negative or zero net add for 3+ consecutive weeks'});
  var tlrVals=entries.slice(0,4).map(function(e){return +e.tlr||0;}).filter(function(v){return v>0;});
  if(tlrVals.length>=3&&tlrVals[0]<tlrVals[2]-10)items.push({type:'warning',msg:'TLR declining: '+tlrVals[2]+' to '+tlrVals[0]});
  var tlrRow=S.tlrData.find(function(r){return r.name.toLowerCase().includes(chapterName.toLowerCase())||chapterName.toLowerCase().includes(r.name.toLowerCase().replace('bni ',''));});
  if(tlrRow&&+tlrRow.score<30)items.push({type:'danger',msg:'TLR critically low at '+tlrRow.score+'/100'});
  if(curr){
    var livePipelineCount=S.visitorPipeline.filter(function(p){return p.chapter===chapterName&&(p.stage||'pipeline')==='pipeline';}).length;
    var prev2=entries.slice(1,3);
    var avgEOIYes=prev2.length?prev2.reduce(function(s,e){return s+(+e.eoiYes||0);},0)/prev2.length:0;
    if(avgEOIYes>=2&&livePipelineCount===0)items.push({type:'info',msg:Math.round(avgEOIYes)+' avg positive EOIs but 0 currently in pipeline'});
    if(livePipelineCount>=3&&entries.slice(0,4).every(function(e){return(+e.inductions||0)===0;}))items.push({type:'info',msg:livePipelineCount+' in pipeline but no inductions in 4 weeks'});
    var eoiPendingRecent=entries.slice(0,2).reduce(function(s,e){var p=(+e.visitors||0)-((+e.eoiYes||0)+(+e.eoiMaybe||0)+(+e.eoiNo||0));return s+Math.max(0,p);},0);
    if(eoiPendingRecent>=3)items.push({type:'warning',msg:eoiPendingRecent+' EOI responses still pending from last 2 weeks'});
    var zeroVis=entries.slice(0,3).filter(function(e){return(+e.visitors||0)===0;}).length;
    if(zeroVis>=3)items.push({type:'warning',msg:'No visitors for 3+ consecutive weeks'});
  }
  var today=new Date(); var plus30=new Date(today); plus30.setDate(today.getDate()+30);
  var urgentRen=(S.duesData||[]).filter(function(m){
    if(m.chapter!==chapterName)return false;
    var k=m.chapter+'_'+m.name+'_'+m.dueDate; if(S.renewalsDone[k])return false;
    var d=new Date(m.dueDate+'T00:00:00'); return d>=today&&d<=plus30;
  }).length;
  if(urgentRen>0)items.push({type:'warning',msg:urgentRen+' renewal'+(urgentRen>1?'s':'')+' due in next 30 days'});
  if(!items.length)items.push({type:'success',msg:'No immediate action items - looking good!'});
  return items;
}

// PIPELINE VELOCITY ─────────────────────────────────────
function setPipelineFilter(field,value){
  if(field==='chapter')S.pipelineFilterChapter=value;
  if(field==='stage')S.pipelineFilterStage=value;
  renderPipelineVelocity();
}

function pipelineCountedIds(entry){
  if(!entry)return[];
  if(Array.isArray(entry.pipelineInductedIds))return entry.pipelineInductedIds.slice();
  if(entry.pipelineInductedIds&&typeof entry.pipelineInductedIds==='object')return Object.keys(entry.pipelineInductedIds).filter(function(k){return entry.pipelineInductedIds[k];});
  return[];
}

function latestCloseBefore(chapter,date){
  var prior=getCascadedEntries(chapter).filter(function(e){return e.date<date;});
  return prior.length?(+prior[prior.length-1].membersClose||0):0;
}

async function adjustWeeklyPipelineInduction(contact,date,delta){
  if(!contact||!contact.id||!contact.chapter||!date||!delta)return;
  var wk=getWeekKey(date);
  var range=getWeekTueFri(wk);
  var existing=S.weeklyData.filter(function(e){return e.chapter===contact.chapter&&e.date>=range.tue&&e.date<=range.fri;}).sort(function(a,b){return b.date.localeCompare(a.date);})[0];
  if(!existing&&delta<0)return;
  var entry=existing||{
    chapter:contact.chapter,
    date:date,
    filledBy:S.user.name,
    filledByRole:S.user.role,
    visitors_list:[],
    membersStart:latestCloseBefore(contact.chapter,date),
    inductions:0,
    drops:0,
    membersClose:0,
    membersConnect:0,
    visitors:0,
    posVisitors:0,
    concall:'No',
    tlr:getTLRFromReport(contact.chapter),
    conversionPct:getTLRConversion(contact.chapter),
    onetwentyone:0,
    references:0,
    tyfcb:0,
    eoiYes:0,
    eoiMaybe:0,
    eoiNo:0,
    eoiPending:0,
    eoi:0,
    pipeline:0,
    renewals:0,
    training:0,
    successStory:'',
    savedAt:new Date().toISOString()
  };
  var ids=pipelineCountedIds(entry);
  var already=ids.includes(contact.id);
  if(delta>0&&already)return;
  if(delta<0&&!already)return;
  if(delta>0)ids.push(contact.id);
  else ids=ids.filter(function(id){return id!==contact.id;});
  entry.pipelineInductedIds=ids;
  entry.inductions=Math.max(0,(+entry.inductions||0)+delta);
  entry.membersClose=calcActiveMembers(+entry.membersStart||0,+entry.inductions||0,+entry.drops||0);
  entry.updatedAt=new Date().toISOString();
  entry.updatedBy=S.user.name;
  var idx=S.weeklyData.findIndex(function(e){return e.chapter===entry.chapter&&e.date===entry.date;});
  if(idx>=0)S.weeklyData[idx]=Object.assign({},S.weeklyData[idx],entry);
  else S.weeklyData.unshift(entry);
  if(!isLocalPreviewMode()){
    await db.collection('weeklyData').doc(entry.chapter+'_'+entry.date).set(entry,{merge:true});
  }
}

async function syncPipelineStageToScorecard(contact,oldStage,newStage,oldStageDate,newStageDate){
  oldStage=oldStage||'pipeline';
  newStage=newStage||'pipeline';
  if(oldStage===newStage)return;
  if(oldStage==='inducted')await adjustWeeklyPipelineInduction(contact,oldStageDate||newStageDate,-1);
  if(newStage==='inducted')await adjustWeeklyPipelineInduction(contact,newStageDate,1);
}

async function markContactStage(pid,stage){
  var today=todayISO();
  var updates={stage:stage,stageChangedDate:today,stageChangedBy:S.user.name};
  try{
    var localContact=S.visitorPipeline.find(function(p){return p.id===pid;});
    var oldStage=localContact?(localContact.stage||'pipeline'):'pipeline';
    var oldStageDate=localContact?(localContact.stageChangedDate||today):today;
    if(localContact)Object.assign(localContact,updates);
    if(S.pipelineFilterStage&&S.pipelineFilterStage!==stage)S.pipelineFilterStage=stage;
    if(isLocalPreviewMode()){
      await syncPipelineStageToScorecard(localContact,oldStage,stage,oldStageDate,today);
      saveLocalPreviewState();
      renderPipelineVelocity();
      refresh();
      toast(stage==='inducted'?'Inducted and moved to Inducted list':'Pipeline status updated locally');
      return;
    }
    await db.collection('visitorPipeline').doc(pid).set(updates,{merge:true});
    await syncPipelineStageToScorecard(localContact,oldStage,stage,oldStageDate,today);
    logActivity('pipeline_stage_changed',{contactId:pid,stage:stage});
    renderPipelineVelocity();
    refresh();
    toast('Updated');
  }catch(e){toast('Failed: '+e.message);}
}

async function deleteContact(pid){
  if(!confirm('Remove this contact from the pipeline tracker?'))return;
  try{
    S.visitorPipeline=(S.visitorPipeline||[]).filter(function(p){return p.id!==pid;});
    if(isLocalPreviewMode()){
      saveLocalPreviewState();
      renderPipelineVelocity();
      toast('Removed locally');
      return;
    }
    await db.collection('visitorPipeline').doc(pid).delete();logActivity('pipeline_contact_deleted',{contactId:pid});renderPipelineVelocity();toast('Removed');
  }
  catch(e){toast('Failed: '+e.message);}
}

// WHATSAPP REPORT ───────────────────────────────────────
function generateWhatsAppReport(){
  var weeks=getWeeks(); var weekKey=S.ovWeek||weeks[0];
  if(!weekKey){toast('No data available');return;}
  var wkr=getWeekTueFri(weekKey); var tue=wkr.tue; var fri=wkr.fri;
  var curr=S.weeklyData.filter(function(e){return e.date>=tue&&e.date<=fri;});
  var visChapters=visibleChapters();
  var visNames=visibleChapterNames();
  curr=curr.filter(function(e){return visNames.includes(e.chapter);});
  var month=tue.substring(0,7);

  var totM=visChapters.reduce(function(s,ch){
    var e=getCascadedForWeek(ch.name,tue,fri);
    return s+(e?(+e.membersClose||0):0);
  },0);
  var totI=curr.reduce(function(s,e){return s+(+e.inductions||0);},0);
  var totD=curr.reduce(function(s,e){return s+(+e.drops||0);},0);
  var totWN=totI-totD;
  var totMN=visChapters.reduce(function(s,ch){
    var chMonthEntries=getCascadedEntries(ch.name).filter(function(e){return e.date.startsWith(month);});
    return s+(chMonthEntries.length?((+chMonthEntries[chMonthEntries.length-1].membersClose||0)-(+chMonthEntries[0].membersStart||0)):0);
  },0);
  var totV=curr.reduce(function(s,e){return s+(+e.visitors||0);},0);
  var totEOIYes=curr.reduce(function(s,e){return s+(+e.eoiYes||0);},0);
  var totEOIMaybe=curr.reduce(function(s,e){return s+(+e.eoiMaybe||0);},0);
  var totEOINo=curr.reduce(function(s,e){return s+(+e.eoiNo||0);},0);
  var totEOI=totEOIYes+totEOIMaybe+totEOINo;

  var submittedChs=visChapters.filter(function(c){return curr.some(function(e){return e.chapter===c.name;});});
  var notSubmittedChs=visChapters.filter(function(c){return!curr.some(function(e){return e.chapter===c.name;});});
  var submitted=submittedChs.length;

  var lines=[];
  lines.push('BNI CHAPTER PULSE - Week of '+fmtWeekChip(weekKey));
  lines.push('--------------------');
  lines.push('Members: '+totM+' | '+submitted+'/'+visChapters.length+' submitted');
  if(notSubmittedChs.length){
    lines.push('Not submitted: '+notSubmittedChs.map(function(c){return c.name;}).join(', '));
  }
  lines.push('--------------------');
  lines.push('Wk Net (Group): '+(totWN>0?'+':'')+totWN+' | Mo Net (Group): '+(totMN>0?'+':'')+totMN);
  lines.push('--------------------');
  lines.push('Chapter-wise Net Add:');
  visChapters.forEach(function(ch){
    var e=curr.find(function(x){return x.chapter===ch.name;});
    if(!e)return;
    var wNet=(+e.inductions||0)-(+e.drops||0);
    var chMonthEntries=getCascadedEntries(ch.name).filter(function(x){return x.date.startsWith(month);});
    var mNet=chMonthEntries.length?((+chMonthEntries[chMonthEntries.length-1].membersClose||0)-(+chMonthEntries[0].membersStart||0)):0;
    lines.push('* '+ch.name+': Wk '+(wNet>0?'+':'')+wNet+' | Mo '+(mNet>0?'+':'')+mNet);
  });
  lines.push('--------------------');
  lines.push('Visitors: '+totV+' | EOI: '+totEOI+' | Positive: '+totEOIYes);
  lines.push('--------------------');

  var pipelineByChap={};
  S.visitorPipeline.forEach(function(p){
    if(!visNames.includes(p.chapter))return;
    if((p.stage||'pipeline')!=='pipeline')return;
    pipelineByChap[p.chapter]=(pipelineByChap[p.chapter]||0)+1;
  });
  var pipelineChaps=Object.keys(pipelineByChap).filter(function(c){return pipelineByChap[c]>0;});
  if(pipelineChaps.length){
    lines.push('Inductions in Pipeline:');
    pipelineChaps.forEach(function(c){lines.push('* '+c+': '+pipelineByChap[c]);});
    lines.push('--------------------');
  }

  // Top Performers - single first place per category
  function topByMetric(getVal,fmt,suppressZero){
    var best=null;
    visChapters.forEach(function(ch){
      var e=curr.find(function(x){return x.chapter===ch.name;});
      var v=getVal(ch,e);
      if(v===null||v===undefined)return;
      if(!best||v>best.v)best={name:ch.name,v:v};
    });
    if(!best)return null;
    if(suppressZero&&best.v===0)return null;
    return best.name+' ('+fmt(best.v)+')';
  }
  // Activity counts: suppress if winning value is 0 (nobody did anything = not a real "leader")
  var tMostInd=topByMetric(function(ch,e){return e?+e.inductions||0:null;},function(v){return '+'+v;},true);
  var tMostVis=topByMetric(function(ch,e){return e?+e.visitors||0:null;},function(v){return v;},true);
  var tMaxTraining=topByMetric(function(ch,e){return e?+e.training||0:null;},function(v){return v;},true);
  // Net performance metrics: always show, even at 0 - holding steady at 0 while others are negative is worth celebrating
  var tNetWeek=topByMetric(function(ch,e){return e?(+e.inductions||0)-(+e.drops||0):null;},function(v){return(v>0?'+':'')+v;},false);
  var tMoNet=topByMetric(function(ch){
    var chMonthEntries=getCascadedEntries(ch.name).filter(function(x){return x.date.startsWith(month);});
    return chMonthEntries.length?((+chMonthEntries[chMonthEntries.length-1].membersClose||0)-(+chMonthEntries[0].membersStart||0)):null;
  },function(v){return(v>0?'+':'')+v;},false);
  // Real metrics regardless of value - never suppressed
  var tRetention=topByMetric(function(ch){
    var tr=S.tlrData.find(function(r){return r.name.toLowerCase().includes(ch.name.toLowerCase())||ch.name.toLowerCase().includes(r.name.toLowerCase().replace('bni ',''));});
    if(!tr||tr.retention===undefined||tr.retention==='')return null;
    var v=parseFloat(String(tr.retention).replace('%',''));
    return isNaN(v)?null:v;
  },function(v){return v+'%';});
  var tTLR=topByMetric(function(ch){
    var tr=S.tlrData.find(function(r){return r.name.toLowerCase().includes(ch.name.toLowerCase())||ch.name.toLowerCase().includes(r.name.toLowerCase().replace('bni ',''));});
    return tr?+tr.score||null:null;
  },function(v){return v;});

  lines.push('Top Performers:');
  if(tMostInd)lines.push('🥇 Most Inductions: '+tMostInd);
  if(tNetWeek)lines.push('🥇 Net Add of the Week: '+tNetWeek);
  if(tMostVis)lines.push('🥇 Most Visitors: '+tMostVis);
  if(tMaxTraining)lines.push('🥇 Max Trainings: '+tMaxTraining);
  if(tMoNet)lines.push('🥇 Leading Monthly Net Add: '+tMoNet);
  if(tRetention)lines.push('🥇 Leading Retention %: '+tRetention);
  if(tTLR)lines.push('🥇 Leading TLR: '+tTLR);
  lines.push('--------------------');

  // Concerns / Red Flags
  var concernLines=[];
  visChapters.forEach(function(ch){
    var e=curr.find(function(x){return x.chapter===ch.name;});
    if(!e)return;
    var pending=(+e.visitors||0)-((+e.eoiYes||0)+(+e.eoiMaybe||0)+(+e.eoiNo||0));
    if(pending>0)concernLines.push('* EOI Pending: '+ch.name+' - '+pending+' pending');
  });
  visChapters.forEach(function(ch){
    var e=curr.find(function(x){return x.chapter===ch.name;});
    if(!e)return;
    var pipelineCount=pipelineByChap[ch.name]||0;
    if(pipelineCount>0&&(+e.inductions||0)===0){
      concernLines.push('* '+ch.name+': has pipeline contacts, 0 inductions this week');
    }
  });
  if(concernLines.length){
    lines.push('Warning: Concerns / Red Flags:');
    concernLines.forEach(function(l){lines.push(l);});
    lines.push('--------------------');
  }

  lines.push('BNI CHAPTER PULSE');
  var report=lines.join('\n');
  var modal=document.createElement('div');
  modal.id='waModal';
  modal.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:500;display:flex;align-items:center;justify-content:center;padding:16px;';
  modal.onclick=function(e){if(e.target===modal)closeModal();};
  var ta=document.createElement('textarea');
  ta.id='waText';
  ta.style.cssText='width:100%;height:280px;font-size:13px;line-height:1.6;border:1px solid var(--border);border-radius:8px;padding:10px;font-family:Calibri, Arial, sans-serif;resize:none;';
  ta.value=report;
  var title=document.createElement('div');
  title.style.cssText='font-size:16px;font-weight:800;margin-bottom:12px;';
  title.textContent='WhatsApp Report';
  var btnRow=document.createElement('div');
  btnRow.className='btn-row';
  btnRow.innerHTML='<button class="btn btn-primary" onclick="copyWA()">Copy to Clipboard</button> <button class="btn btn-secondary" onclick="closeModal()">Close</button>';
  var box=document.createElement('div');
  box.setAttribute('data-modal','1');
  box.style.cssText='background:var(--card);border-radius:16px;padding:20px;max-width:500px;width:100%;max-height:80vh;overflow-y:auto;';
  box.appendChild(title);box.appendChild(ta);box.appendChild(btnRow);
  modal.appendChild(box);
  document.body.appendChild(modal);
}

  toast('Copied - paste in WhatsApp');
}

// MONTHLY RETROSPECTIVE ─────────────────────────────────
function getChapterMonthRetro(ch,month){
  var chEntries=getCascadedEntries(ch.name).filter(function(e){return e.date.startsWith(month);}).sort(function(a,b){return a.date.localeCompare(b.date);});
  if(!chEntries.length)return{name:ch.name,director:chapterDirectorName(ch),hasData:false};
  var first=chEntries[0],last=chEntries[chEntries.length-1];
  var startMembers=+first.membersStart||0;
  var closeMembers=+last.membersClose||0;
  var inductions=chEntries.reduce(function(s,e){return s+(+e.inductions||0);},0);
  var drops=chEntries.reduce(function(s,e){return s+(+e.drops||0);},0);
  var netAdd=closeMembers-startMembers;
  var totRefs=chEntries.reduce(function(s,e){return s+(+e.references||0);},0);
  var totVis=chEntries.reduce(function(s,e){return s+(+e.visitors||0);},0);
  var totPos=chEntries.reduce(function(s,e){return s+(+e.posVisitors||+e.eoiYes||0);},0);
  var totTYFCB=chEntries.reduce(function(s,e){return s+(+e.tyfcb||0);},0);
  var totEOIYes=chEntries.reduce(function(s,e){return s+(+e.eoiYes||0);},0);
  var totEOIMaybe=chEntries.reduce(function(s,e){return s+(+e.eoiMaybe||0);},0);
  var totEOINo=chEntries.reduce(function(s,e){return s+(+e.eoiNo||0);},0);
  var convEntries=chEntries.filter(function(e){return e.conversionPct!==undefined&&e.conversionPct!==null;});
  var conv=totVis>0?Math.round((totPos/totVis)*100):(convEntries.length?Math.round(convEntries.reduce(function(s,e){return s+(+e.conversionPct||0);},0)/convEntries.length):0);
  var tlrEntries=chEntries.filter(function(e){return +e.tlr>0;});
  var tlr=tlrEntries.length?Math.round((tlrEntries.reduce(function(s,e){return s+(+e.tlr||0);},0)/tlrEntries.length)*100)/100:null;
  if(tlr===null){
    var tlrRow=S.tlrData.find(function(r){return r.name.toLowerCase().includes(ch.name.toLowerCase())||ch.name.toLowerCase().includes(r.name.toLowerCase().replace('bni ',''));});
    tlr=tlrRow?+tlrRow.score:null;
  }
  var rMoTgt=getMonthlyTarget(ch.name,month);
  var rMoGap=rMoTgt>0?rMoTgt-closeMembers:0;
  var rDue=(S.duesData||[]).filter(function(m){return m.chapter===ch.name&&m.dueDate&&m.dueDate.startsWith(month);}).length;
  var rDone=(S.duesData||[]).filter(function(m){
    if(m.chapter!==ch.name||!m.dueDate||!m.dueDate.startsWith(month))return false;
    return isRenewalDone(m);
  }).length;
  var weekCount=Object.keys(chEntries.reduce(function(a,e){a[getWeekKey(e.date)]=1;return a;},{})).length;
  return{name:ch.name,director:chapterDirectorName(ch),hasData:true,startMembers:startMembers,closeMembers:closeMembers,inductions:inductions,drops:drops,netAdd:netAdd,totRefs:totRefs,totVis:totVis,totPos:totPos,conv:conv,totTYFCB:totTYFCB,totEOI:totEOIYes+totEOIMaybe+totEOINo,totEOIYes:totEOIYes,totEOIMaybe:totEOIMaybe,totEOINo:totEOINo,tlr:tlr,weeks:weekCount,moTarget:rMoTgt,moGap:rMoGap,renewalsDue:rDue,renewalsDone:rDone};
}

// SD REPORT ─────────────────────────────────────────────
function renderSDReport(){
  var el=document.getElementById('tab-sdreport'); if(!el)return;
  var visChapters=visibleChapters();
  var visNames=visibleChapterNames();
  var allMonths=[]; var seen={};
  S.weeklyData.forEach(function(e){if(!visNames.includes(e.chapter))return;var m=e.date.substring(0,7);if(!seen[m]){seen[m]=1;allMonths.push(m);}});
  allMonths.sort().reverse();
  var selMonthEl=document.getElementById('sdReportMonth');
  var selMonth=selMonthEl?selMonthEl.value:'';
  if(!selMonth&&allMonths.length)selMonth=allMonths[0];
  if(!selMonth){el.innerHTML='<div class="card"><div class="empty">No data yet</div></div>';return;}

  var viewMode=S.sdReportView||'monthly';

  var monthEntries=S.weeklyData.filter(function(e){return e.date.startsWith(selMonth)&&visNames.includes(e.chapter);});
  // For week keys: include cross-month weeks where any day falls in this month
  // A week belongs to a month if its Tue-Fri window overlaps with the month
  var weekKeySet={};
  S.weeklyData.forEach(function(e){
    if(!visNames.includes(e.chapter))return;
    var wk=getWeekKey(e.date);
    var wr=getWeekTueFri(wk);
    // Include this week if any day of the week falls in selMonth
    if(wr.tue.startsWith(selMonth)||wr.fri.startsWith(selMonth)||e.date.startsWith(selMonth)){
      weekKeySet[wk]=1;
    }
  });
  var weekKeys=Object.keys(weekKeySet).sort();
  // For weekly view: use all data in the week range, not just monthEntries
  var allWeeklyData=S.weeklyData.filter(function(e){return visNames.includes(e.chapter);});

  var latestPerChap={};
  visChapters.forEach(function(ch){var l=getLatestCascaded(ch.name);if(l)latestPerChap[ch.name]=l;});
  var monthOpts=allMonths.map(function(m){return '<option value="'+m+'"'+(m===selMonth?' selected':'')+'>'+fmtM(m)+'</option>';}).join('');

  var h='<div class="card">';

  h+='<div style="display:flex;border:1.5px solid var(--border);border-radius:8px;overflow:hidden;">';

  h+='<button onclick="setSDView(&quot;weekly&quot;)" style="padding:6px 12px;font-size:12px;font-weight:700;border:none;cursor:pointer;background:'+(viewMode==='weekly'?'var(--navy)':'var(--card)')+';color:'+(viewMode==='weekly'?'#fff':'var(--text)')+';">Weekly</button>';
  h+='<button onclick="setSDView(&quot;range&quot;)" style="padding:6px 12px;font-size:12px;font-weight:700;border:none;cursor:pointer;background:'+(viewMode==='range'?'var(--navy)':'var(--card)')+';color:'+(viewMode==='range'?'#fff':'var(--text)')+';">Date Range</button>';
  h+='</div>';
  if(viewMode!=='range'){
    h+='<select id="sdReportMonth" onchange="renderSDReport()" style="width:auto;padding:7px 12px;font-size:13px;">'+monthOpts+'</select>';
  } else {
    var rFrom=S.sdRangeFrom||'';
    var rTo=S.sdRangeTo||'';
    h+='<input type="date" id="sdRangeFrom" value="'+rFrom+'" onchange="setSDRange()" style="padding:6px 10px;font-size:12px;border:1.5px solid var(--border);border-radius:8px;">';
    h+='<span style="font-size:12px;color:var(--muted);">to</span>';
    h+='<input type="date" id="sdRangeTo" value="'+rTo+'" onchange="setSDRange()" style="padding:6px 10px;font-size:12px;border:1.5px solid var(--border);border-radius:8px;">';
  }
  if(viewMode==='range'){
    var rf=S.sdRangeFrom||'';
    var rt=S.sdRangeTo||'';
    if(!rf||!rt){
      h+='<div class="empty" style="padding:30px;">Select a From and To date above to generate the range report</div></div>';
      el.innerHTML=h;
      return;
    }
    h+='<div class="card-t">RANGE REPORT - '+rf+' to '+rt+'</div>';
    h+='<div style="overflow-x:auto;"><table class="rtbl"><thead><tr><th>Chapter</th><th>Inductions</th><th>Drops</th><th>Net Add</th><th>Renewals Due</th><th>Renewals Done</th></tr></thead><tbody>';
    var rTotInd=0,rTotDrop=0,rTotDue=0,rTotDone=0;
    visChapters.forEach(function(ch){
      var rEntries=getCascadedEntries(ch.name).filter(function(e){return e.date>=rf&&e.date<=rt;});
      var rInd=rEntries.reduce(function(s,e){return s+(+e.inductions||0);},0);
      var rDrop=rEntries.reduce(function(s,e){return s+(+e.drops||0);},0);
      var rNet=rInd-rDrop;
      // Renewals due in range
      var rDue=(S.duesData||[]).filter(function(m){return m.chapter===ch.name&&m.dueDate>=rf&&m.dueDate<=rt;}).length;
      // Renewals done in range (marked done, due date in range)
      var rDone=(S.duesData||[]).filter(function(m){
        if(m.chapter!==ch.name)return false;
        if(m.dueDate<rf||m.dueDate>rt)return false;
        var k=m.chapter+'_'+m.name+'_'+m.dueDate;
        return !!S.renewalsDone[k];
      }).length;
      rTotInd+=rInd;rTotDrop+=rDrop;rTotDue+=rDue;rTotDone+=rDone;
      var rNetCol=rNet>0?'var(--green)':rNet<0?'var(--red)':'var(--muted)';
      h+='<tr>';

function exportSDReport(month){
  var visChapters=visibleChapters();
  var visNames=visibleChapterNames();
  var monthEntries=S.weeklyData.filter(function(e){return e.date.startsWith(month)&&visNames.includes(e.chapter);});
  var weekKeySet={}; monthEntries.forEach(function(e){weekKeySet[getWeekKey(e.date)]=1;});
  var weekKeys=Object.keys(weekKeySet).sort();
  var hdr=['Chapter','DC'].concat(weekKeys.reduce(function(a,_,i){return a.concat(['Wk'+(i+1)+' Add','Wk'+(i+1)+' Drop','Wk'+(i+1)+' Net']);},[])).concat(['Mo Add','Mo Drop','Mo Net']).join(',');
  var rows=visChapters.map(function(ch){
    var dc=S.members.find(function(m){return(m.chapters||[m.chapter]).includes(ch.name)&&isChapterDirectorRole(m.role);});
    var weekData=weekKeys.map(function(wk){var r=getWeekTueFri(wk);var e=monthEntries.find(function(x){return x.chapter===ch.name&&x.date>=r.tue&&x.date<=r.fri;});return e?{add:+e.inductions||0,drop:+e.drops||0}:{add:0,drop:0};});
    var totAdd=weekData.reduce(function(s,w){return s+w.add;},0);
    var totDrop=weekData.reduce(function(s,w){return s+w.drop;},0);
    return [ch.name,dc?dc.name:''].concat(weekData.reduce(function(a,w){return a.concat([w.add,w.drop,w.add-w.drop]);},[])).concat([totAdd,totDrop,totAdd-totDrop]).join(',');
  });
  dl([hdr].concat(rows).join('\n'),'BNI_SD_Report_'+month+'.csv','text/csv');
  toast('SD Report exported');
}

const BANDS = [
  {name:'Breakthrough', min:0,  max:34,  color:'#6B7280'},
  {name:'Momentum',     min:35, max:50,  color:'#3B82F6'},
  {name:'Power',        min:51, max:75,  color:'#7C3AED'},
  {name:'Legacy',       min:76, max:9999,color:'#2D9B6F'}
];

function getBand(members){
  return BANDS.find(function(b){return members>=b.min&&members<=b.max;})||BANDS[0];
}

function getBandPill(members){
  var b=getBand(members);
  return '<span style="background:'+b.color+'20;color:'+b.color+';padding:3px 9px;border-radius:9px;font-size:12px;font-weight:700;">'+esc(b.name)+'</span>';
}

// S.chapterGoals loaded from Firestore: { "Faustus": { inductions:5, netAdd:3, retention:80, targetBand:'Power', dcGoal:'...', sa1Goal:'...', sa2Goal:'...' }, ... }

function subGoals(){
  var u=db.collection('meta').doc('chapterGoals').onSnapshot(function(d){
    if(d.exists)S.chapterGoals=d.data();else S.chapterGoals={};
    if(S.tab==='goals')renderGoalsTab();
  });
  S.unsubs.push(u);
}

async function saveChapterGoal(chapterName, field, value){
  if(!S.chapterGoals)S.chapterGoals={};
  if(!S.chapterGoals[chapterName])S.chapterGoals[chapterName]={};
  S.chapterGoals[chapterName][field]=value;
  var update={};
  update[chapterName]=S.chapterGoals[chapterName];
  try{
    await db.collection('meta').doc('chapterGoals').set(update,{merge:true});
  }catch(e){console.warn('Goal save error:',e);}
}

async function saveMonthlyGoal(ch, monthKey, field, value){

  // For 'members' also update the main getMonthlyTarget key (ChapterName_YYYY-MM)

}
